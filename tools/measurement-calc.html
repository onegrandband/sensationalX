<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensationalX Cooking Calc</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = { darkMode: 'class' }
        // Theme init
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-[#0b0b0c] text-gray-900 dark:text-white font-sans antialiased transition-colors duration-300 min-h-screen flex flex-col">

    <header class="flex items-center justify-between border-b border-gray-200 dark:border-[#2a2a2e] bg-white dark:bg-[#1c1c1f] px-[8%] py-4 sticky top-0 z-40 transition-colors">
        <div class="text-xl font-extrabold tracking-widest uppercase flex items-center gap-2">
            <span class="text-[#ff3366]">SX</span> Cooking
            <i data-lucide="chef-hat" class="w-5 h-5 text-[#ff3366]"></i>
        </div>
        <nav class="flex items-center gap-6">
            <a href="#" class="text-sm font-bold uppercase tracking-wider text-gray-500 hover:text-[#ff3366] transition-colors">Home</a>
            <button onclick="toggleTheme()" class="text-gray-500 hover:text-black dark:text-gray-400 dark:hover:text-white transition-colors">
                <i id="themeIcon" data-lucide="moon" class="w-5 h-5"></i>
            </button>
        </nav>
    </header>

    <main class="flex-1 px-[8%] py-12 flex items-center justify-center">
        
        <div class="w-full max-w-md p-8 rounded-3xl border border-gray-200 dark:border-[#2a2a2e] bg-white dark:bg-[#1c1c1f] shadow-xl shadow-[#ff3366]/5 transition-colors">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black mb-2">Measurement Calc</h1>
                <p class="text-gray-500 dark:text-gray-400 text-sm">Convert your cooking units instantly.</p>
            </div>

            <div class="space-y-5">
                <div>
                    <label for="inputValue" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2 uppercase tracking-wide">Amount</label>
                    <div class="relative">
                        <i data-lucide="scale" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                        <input type="number" id="inputValue" placeholder="e.g. 2.5" value="1" min="0" step="any" 
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 dark:border-[#2a2a2e] bg-gray-50 dark:bg-[#0b0b0c] focus:outline-none focus:border-[#ff3366] dark:focus:border-[#ff3366] transition-colors text-gray-900 dark:text-white font-medium">
                    </div>
                </div>

                <div>
                    <label for="fromUnit" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2 uppercase tracking-wide">From</label>
                    <select id="fromUnit" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-[#2a2a2e] bg-gray-50 dark:bg-[#0b0b0c] focus:outline-none focus:border-[#ff3366] dark:focus:border-[#ff3366] transition-colors text-gray-900 dark:text-white cursor-pointer font-medium appearance-none">
                        <option value="teaspoon">Teaspoons (tsp)</option>
                        <option value="tablespoon">Tablespoons (tbsp)</option>
                        <option value="fluid_ounce">Fluid Ounces (fl oz)</option>
                        <option value="cup" selected>Cups (c)</option>
                        <option value="pint">Pints (pt)</option>
                        <option value="quart">Quarts (qt)</option>
                        <option value="gallon">Gallons (gal)</option>
                        <option value="milliliter">Milliliters (ml)</option>
                        <option value="liter">Liters (L)</option>
                    </select>
                </div>

                <div class="flex justify-center -my-2 relative z-10">
                    <div class="bg-white dark:bg-[#1c1c1f] p-2 rounded-full border border-gray-200 dark:border-[#2a2a2e]">
                        <i data-lucide="arrow-down-up" class="w-4 h-4 text-gray-400"></i>
                    </div>
                </div>

                <div>
                    <label for="toUnit" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2 uppercase tracking-wide">To</label>
                    <select id="toUnit" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-[#2a2a2e] bg-gray-50 dark:bg-[#0b0b0c] focus:outline-none focus:border-[#ff3366] dark:focus:border-[#ff3366] transition-colors text-gray-900 dark:text-white cursor-pointer font-medium appearance-none">
                        <option value="teaspoon">Teaspoons (tsp)</option>
                        <option value="tablespoon" selected>Tablespoons (tbsp)</option>
                        <option value="fluid_ounce">Fluid Ounces (fl oz)</option>
                        <option value="cup">Cups (c)</option>
                        <option value="pint">Pints (pt)</option>
                        <option value="quart">Quarts (qt)</option>
                        <option value="gallon">Gallons (gal)</option>
                        <option value="milliliter">Milliliters (ml)</option>
                        <option value="liter">Liters (L)</option>
                    </select>
                </div>

                <button onclick="calculate()" class="w-full mt-6 py-4 rounded-xl bg-[#ff3366]/10 text-[#ff3366] font-bold uppercase tracking-wider hover:bg-[#ff3366] hover:text-white transition-all duration-300 flex items-center justify-center gap-2 group">
                    <i data-lucide="calculator" class="w-5 h-5 transition-transform group-hover:scale-110"></i>
                    Calculate Now
                </button>
            </div>

            <div id="resultBox" class="mt-8 p-6 rounded-2xl bg-gray-50 dark:bg-[#0b0b0c] border border-gray-200 dark:border-[#2a2a2e] text-center hidden transition-all">
                <p id="resultText" class="text-gray-500 dark:text-gray-400 text-sm font-medium mb-1">Result</p>
                <div id="resultValue" class="text-3xl font-black text-[#ff3366]">---</div>
            </div>

        </div>
    </main>

    <script>
        // --- THEME LOGIC ---
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        }

        // Initialize icons on load
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            // Set correct theme icon on initial load
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        });

        // --- CALCULATOR LOGIC ---
        const conversionRates = {
            teaspoon: 1,
            tablespoon: 3,
            fluid_ounce: 6,
            cup: 48,
            pint: 96,
            quart: 192,
            gallon: 768,
            milliliter: 0.202884,
            liter: 202.884
        };

        function calculate() {
            const amount = parseFloat(document.getElementById('inputValue').value);
            const fromUnit = document.getElementById('fromUnit').value;
            const toUnit = document.getElementById('toUnit').value;
            
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');
            const resultValue = document.getElementById('resultValue');

            // Un-hide the result box
            resultBox.classList.remove('hidden');

            if (isNaN(amount) || amount < 0) {
                resultText.innerText = "Error";
                resultValue.innerText = "Invalid Number";
                resultValue.classList.replace('text-[#ff3366]', 'text-red-500');
                return;
            }

            // Math execution
            const baseValue = amount * conversionRates[fromUnit];
            const finalValue = baseValue / conversionRates[toUnit];
            
            // Round to 3 decimal places max to keep it clean
            const roundedValue = Math.round(finalValue * 1000) / 1000;

            // Get nice readable names for the display
            const fromText = document.getElementById('fromUnit').options[document.getElementById('fromUnit').selectedIndex].text.split(' ')[0];
            const toText = document.getElementById('toUnit').options[document.getElementById('toUnit').selectedIndex].text.split(' ')[0];

            // Update DOM
            resultValue.classList.replace('text-red-500', 'text-[#ff3366]');
            resultText.innerText = `${amount} ${fromText} is equal to`;
            resultValue.innerHTML = `${roundedValue} <span class="text-lg font-bold text-gray-900 dark:text-white">${toText}</span>`;
        }
    </script>
</body>
</html>
