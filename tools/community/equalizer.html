<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Graphic EQ, Waveform & Export Studio</title>
    <!-- FFmpeg WASM UMD scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/umd/ffmpeg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0c;
            --card-bg: #1c1c1f;
            --border-color: #2a2a2e;
            --accent: #ff3366;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .header-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .title-group {
            text-align: left;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 1.8rem;
            letter-spacing: 0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        .delete-data-btn {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .delete-data-btn:hover {
            background: rgba(255, 51, 102, 0.1);
            border-color: var(--accent);
        }

        .studio-container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .controls-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        .file-upload-label, .export-btn {
            background: linear-gradient(135deg, #ff3366, #b81d45);
            color: #ffffff;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(255, 51, 102, 0.4);
            transition: all 0.2s ease;
            display: inline-block;
            border: none;
        }

        .file-upload-label:hover, .export-btn:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .export-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        input[type="file"] {
            display: none;
        }

        .playback-buttons {
            display: flex;
            gap: 10px;
        }

        button.action-btn {
            background: #2a2a2e;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.action-btn:hover:not(:disabled) {
            background: #3a3a3e;
            border-color: var(--accent);
        }

        button.action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #trackInfo {
            font-size: 0.9rem;
            color: var(--accent);
            font-weight: 500;
        }

        .canvas-container {
            position: relative;
            background-color: #000000;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
        }

        canvas {
            display: block;
            width: 100%;
            height: 180px;
        }

        .eq-section, .export-section {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .eq-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 16px;
        }

        .eq-slider-group {
            background: #151518;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .eq-slider-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .eq-slider-group input[type="range"] {
            writing-mode: vertical-lr;
            direction: rtl;
            width: 8px;
            height: 110px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .eq-value {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .export-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        select {
            background: #151518;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="title-group">
            <h1>Audio Graphic EQ, Waveform & Export Studio</h1>
            <p>Upload an audio file, scrub through the waveform, tweak the graphic EQ, and export using FFmpeg.</p>
        </div>
        <button id="deleteDataBtn" class="delete-data-btn">Delete Changes</button>
    </div>
    
    <div class="studio-container">
        <div class="controls-bar">
            <label class="file-upload-label">
                Upload Audio File
                <input type="file" id="audioFile" accept=".mp3,.wav,.flac,.m4a,.m4r">
            </label>
            <div class="playback-buttons">
                <button id="playBtn" class="action-btn" disabled>Play</button>
                <button id="pauseBtn" class="action-btn" disabled>Pause</button>
                <button id="stopBtn" class="action-btn" disabled>Stop</button>
            </div>
        </div>

        <div id="trackInfo">No file loaded</div>

        <div class="canvas-container" id="canvasContainer">
            <canvas id="waveformCanvas"></canvas>
        </div>

        <div class="eq-section">
            <div class="section-title">Graphic Equalizer</div>
            <div class="eq-grid" id="eqGrid"></div>
        </div>

        <div class="export-section">
            <div class="section-title">Export Processed Audio (FFmpeg)</div>
            <div class="export-controls">
                <select id="exportFormat">
                    <option value="wav">WAV (Lossless PCM)</option>
                    <option value="mp3">MP3 (MPEG Audio Layer III)</option>
                    <option value="flac">FLAC (Free Lossless Audio Codec)</option>
                    <option value="m4a">M4A (MPEG-4 Audio)</option>
                    <option value="m4r">M4R (iPhone Ringtone)</option>
                </select>
                <button id="exportBtn" class="export-btn" disabled>Export & Download</button>
            </div>
        </div>
    </div>

    <!-- External Script File -->
    <script src="script.js"></script>
</body>
</html>
