<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Graphic EQ & Waveform Studio</title>
    <style>
        :root {
            --bg-color: #0b0b0c;
            --card-bg: #1c1c1f;
            --border-color: #2a2a2e;
            --accent: #ff3366;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 1.8rem;
            letter-spacing: 0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
            text-align: center;
            max-width: 600px;
        }

        .studio-container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .controls-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        .file-upload-label {
            background: linear-gradient(135deg, #ff3366, #b81d45);
            color: #ffffff;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(255, 51, 102, 0.4);
            transition: all 0.2s ease;
            display: inline-block;
        }

        .file-upload-label:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        input[type="file"] {
            display: none;
        }

        .playback-buttons {
            display: flex;
            gap: 10px;
        }

        button.action-btn {
            background: #2a2a2e;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.action-btn:hover:not(:disabled) {
            background: #3a3a3e;
            border-color: var(--accent);
        }

        button.action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #trackInfo {
            font-size: 0.9rem;
            color: var(--accent);
            font-weight: 500;
        }

        .canvas-container {
            position: relative;
            background-color: #000000;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
        }

        canvas {
            display: block;
            width: 100%;
            height: 180px;
        }

        .eq-section {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .eq-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .eq-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 16px;
        }

        .eq-slider-group {
            background: #151518;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .eq-slider-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .eq-slider-group input[type="range"] {
            writing-mode: bt-lr; /* IE */
            writing-mode: vertical-lr;
            direction: rtl;
            width: 8px;
            height: 110px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .eq-value {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <h1>Audio Graphic EQ & Waveform Studio</h1>
    <p>Upload an MP3, WAV, or FLAC track, scrub through the waveform playhead, and dynamically tweak the graphic EQ.</p>
    
    <div class="studio-container">
        <div class="controls-bar">
            <label class="file-upload-label">
                Upload Audio File
                <input type="file" id="audioFile" accept=".mp3,.wav,.flac">
            </label>
            <div class="playback-buttons">
                <button id="playBtn" class="action-btn" disabled>Play</button>
                <button id="pauseBtn" class="action-btn" disabled>Pause</button>
                <button id="stopBtn" class="action-btn" disabled>Stop</button>
            </div>
        </div>

        <div id="trackInfo">No file loaded</div>

        <div class="canvas-container" id="canvasContainer">
            <canvas id="waveformCanvas"></canvas>
        </div>

        <div class="eq-section">
            <div class="eq-title">Graphic Equalizer</div>
            <div class="eq-grid" id="eqGrid">
                <!-- EQ Sliders injected via JS -->
            </div>
        </div>
    </div>

    <script>
        const audioFileInput = document.getElementById('audioFile');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const trackInfo = document.getElementById('trackInfo');
        const canvas = document.getElementById('waveformCanvas');
        const canvasContainer = document.getElementById('canvasContainer');
        const ctx = canvas.getContext('2d');
        const eqGrid = document.getElementById('eqGrid');

        let audioCtx = null;
        let audioBuffer = null;
        let sourceNode = null;
        let gainNode = null;
        let eqFilters = [];

        let isPlaying = false;
        let startTime = 0;
        let pauseOffset = 0;
        let animationFrameId = null;

        // EQ Frequency Bands Configuration
        const eqBands = [
            { freq: 60, label: '60 Hz' },
            { freq: 170, label: '170 Hz' },
            { freq: 350, label: '350 Hz' },
            { freq: 1000, label: '1 kHz' },
            { freq: 3500, label: '3.5 kHz' },
            { freq: 10000, label: '10 kHz' }
        ];

        // Initialize UI Sliders
        function initEQUI() {
            eqGrid.innerHTML = '';
            eqBands.forEach((band, index) => {
                const group = document.createElement('div');
                group.className = 'eq-slider-group';
                group.innerHTML = `
                    <label>${band.label}</label>
                    <input type="range" id="eq-${index}" min="-20" max="20" step="0.5" value="0">
                    <span class="eq-value" id="val-${index}">0.0 dB</span>
                `;
                eqGrid.appendChild(group);

                const slider = group.querySelector('input');
                const valDisplay = group.querySelector(`#val-${index}`);
                
                slider.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    valDisplay.textContent = `${val > iconPlus(val) ? '+' : ''}${val.toFixed(1)} dB`;
                    if (eqFilters[index]) {
                        eqFilters[index].gain.value = val;
                    }
                });
            });
        }
        function iconPlus(v) { return v > 0 ? '+' : ''; }
        initEQUI();

        // Handle File Upload & Decoding
        audioFileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            trackInfo.textContent = `Loading: ${file.name}...`;
            stopAudio();

            try {
                const arrayBuffer = await file.arrayBuffer();
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                
                trackInfo.textContent = `Loaded: ${file.name} (${formatTime(audioBuffer.duration)})`;
                playBtn.disabled = false;
                pauseBtn.disabled = true;
                stopBtn.disabled = true;
                pauseOffset = 0;

                resizeCanvas();
                drawWaveform();
            } catch (err) {
                trackInfo.textContent = 'Error loading audio file.';
                alert('Could not decode audio file. Ensure it is a valid MP3, WAV, or FLAC.');
            }
        });

        function resizeCanvas() {
            canvas.width = canvasContainer.clientWidth * window.devicePixelRatio;
            canvas.height = 180 * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        window.addEventListener('resize', () => {
            if (audioBuffer) {
                resizeCanvas();
                drawWaveform();
            }
        });

        // Draw Static Waveform
        function drawWaveform(playheadTime = 0) {
            if (!audioBuffer) return;

            const width = canvasContainer.clientWidth;
            const height = 180;
            ctx.clearRect(0, 0, width, height);

            const rawData = audioBuffer.getChannelData(0);
            const samples = width;
            const blockSz = Math.floor(rawData.length / samples);
            const amp = height / 2;

            // Draw Waveform Bars
            ctx.fillStyle = '#2e2e38';
            for (let i = 0; i < samples; i++) {
                let min = 1.0;
                let max = -1.0;
                for (let j = 0; j < blockSz; j++) {
                    const val = rawData[i * blockSz + j];
                    if (val < min) min = val;
                    if (val > max) max = val;
                }
                const yMin = (1.0 + min) * amp;
                const yMax = (1.0 + max) * amp;
                
                // Highlight played section vs unplayed
                const progressTime = (i / samples) * audioBuffer.duration;
                ctx.fillStyle = progressTime <= playheadTime ? '#ff3366' : '#3f3f4a';
                ctx.fillRect(i, yMin, 1, Math.max(1, yMax - yMin));
            }

            // Draw Playhead Line
            if (audioBuffer.duration > 0) {
                const playheadX = (playheadTime / audioBuffer.duration) * width;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(playheadX, 0);
                ctx.lineTo(playheadX, height);
                ctx.stroke();
            }
        }

        // Setup Web Audio Graph Pipeline & EQ filters
        function setupAudioGraph() {
            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = audioBuffer;

            // Create Master Gain
            gainNode = audioCtx.createGain();
            gainNode.gain.value = 1.0;

            // Create EQ Biquad Filters
            eqFilters = eqBands.map((band, index) => {
                const filter = audioCtx.createBiquadFilter();
                filter.type = index === 0 ? 'lowshelf' : (index === eqBands.length - 1 ? 'highshelf' : 'peaking');
                filter.frequency.value = band.freq;
                filter.Q.value = 1.0;
                
                // Sync current slider value
                const sliderVal = parseFloat(document.getElementById(`eq-${index}`).value);
                filter.gain.value = sliderVal;
                return filter;
            });

            // Connect Chain: Source -> Filter 0 -> Filter 1 -> ... -> Gain -> Destination
            let lastNode = sourceNode;
            eqFilters.forEach(filter => {
                lastNode.connect(filter);
                lastNode = filter;
            });

            lastNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            sourceNode.onended = () => {
                if (isPlaying && (audioCtx.currentTime - startTime >= audioBuffer.duration - pauseOffset)) {
                    stopAudio();
                }
            };
        }

        // Playback Controls
        playBtn.addEventListener('click', () => {
            if (!audioBuffer || isPlaying) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            setupAudioGraph();

            sourceNode.start(0, pauseOffset);
            startTime = audioCtx.currentTime;
            isPlaying = true;

            playBtn.disabled = true;
            pauseBtn.disabled = false;
            stopBtn.disabled = false;
            audioFileInput.disabled = true;

            trackLoop();
        });

        pauseBtn.addEventListener('click', () => {
            if (!isPlaying) return;
            pauseOffset += audioCtx.currentTime - startTime;
            stopPlaybackOnly();

            playBtn.disabled = false;
            pauseBtn.disabled = true;
            stopBtn.disabled = false;
            audioFileInput.disabled = false;
        });

        stopBtn.addEventListener('click', () => {
            stopAudio();
        });

        function stopPlaybackOnly() {
            if (sourceNode) {
                try { sourceNode.stop(); } catch (e) {}
                sourceNode.disconnect();
                sourceNode = null;
            }
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            isPlaying = false;
        }

        function stopAudio() {
            stopPlaybackOnly();
            pauseOffset = 0;
            if (audioBuffer) {
                drawWaveform(0);
                playBtn.disabled = false;
            }
            pauseBtn.disabled = true;
            stopBtn.disabled = true;
            audioFileInput.disabled = false;
        }

        // Animation Loop for Playhead Tracking
        function trackLoop() {
            if (!isPlaying) return;

            const currentPlaybackTime = pauseOffset + (audioCtx.currentTime - startTime);
            if (currentPlaybackTime >= audioBuffer.duration) {
                stopAudio();
                return;
            }

            drawWaveform(currentPlaybackTime);
            animationFrameId = requestAnimationFrame(trackLoop);
        }

        // Click on Waveform to Scrub Playhead
        canvasContainer.addEventListener('click', (e) => {
            if (!audioBuffer) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickRatio = clickX / rect.width;
            const targetTime = clickRatio * audioBuffer.duration;

            const wasPlaying = isPlaying;
            if (isPlaying) {
                stopPlaybackOnly();
            }

            pauseOffset = targetTime;
            drawWaveform(targetTime);

            if (wasPlaying) {
                playBtn.click();
            }
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
    </script>
</body>
</html>
