<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio File Spectrogram Visualizer</title>
    <style>
        body {
            margin: 0;
            background-color: #0f111a;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 1.6rem;
            letter-spacing: 0.5px;
        }

        p {
            color: #8b9bb4;
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-align: center;
            max-width: 500px;
        }

        #controls {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .file-upload-label {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #ffffff;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
            display: inline-block;
        }

        .file-upload-label:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        input[type="file"] {
            display: none;
        }

        button {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
            transition: all 0.2s ease;
        }

        button:hover:not(:disabled) {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .canvas-container {
            background-color: #000000;
            border: 1px solid #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
        }

        #trackInfo {
            font-size: 0.9rem;
            color: #10b981;
            margin-bottom: 15px;
            font-weight: 500;
            height: 20px;
        }
    </style>
</head>
<body>

    <h1>Audio File Spectrogram</h1>
    <p>Upload an MP3, WAV, or FLAC file to visualize its frequencies over time.</p>
    
    <div id="controls">
        <label class="file-upload-label">
            Choose Audio File
            <input type="file" id="audioFile" accept=".mp3,.wav,.flac">
        </label>
        <button id="playBtn" disabled>Play</button>
        <button id="pauseBtn" disabled>Pause</button>
    </div>

    <div id="trackInfo"></div>

    <div class="canvas-container">
        <canvas id="spectrogram" width="800" height="400"></canvas>
    </div>

    <script>
        const audioFileInput = document.getElementById('audioFile');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const trackInfo = document.getElementById('trackInfo');
        const canvas = document.getElementById('spectrogram');
        const ctx = canvas.getContext('2d');

        let audioCtx, analyser, sourceNode;
        let audioBuffer = null;
        let startTime = 0;
        let pauseOffset = 0;
        let isPlaying = false;
        let animationId = null;

        audioFileInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            trackInfo.textContent = `Loading: ${file.name}...`;
            stopAudio();

            try {
                const arrayBuffer = await file.arrayBuffer();
                
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }

                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                trackInfo.textContent = `Loaded: ${file.name}`;
                playBtn.disabled = false;
                pauseBtn.disabled = true;
                pauseOffset = 0;
            } catch (err) {
                trackInfo.textContent = '';
                alert('Error decoding audio file. Make sure it is a valid MP3, WAV, or FLAC file: ' + err.message);
            }
        });

        playBtn.addEventListener('click', () => {
            if (!audioBuffer || isPlaying) return;

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = audioBuffer;

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 1024;
            analyser.smoothingTimeConstant = 0.1;

            sourceNode.connect(analyser);
            analyser.connect(audioCtx.destination);

            sourceNode.onended = () => {
                if (isPlaying && audioCtx.currentTime - startTime >= audioBuffer.duration) {
                    stopAudio();
                }
            };

            sourceNode.start(0, pauseOffset);
            startTime = audioCtx.currentTime - pauseOffset;
            isPlaying = true;

            playBtn.disabled = true;
            pauseBtn.disabled = false;
            audioFileInput.disabled = true;

            visualize();
        });

        pauseBtn.addEventListener('click', () => {
            if (!isPlaying) return;

            pauseOffset = audioCtx.currentTime - startTime;
            stopAudioPlaybackOnly();

            playBtn.disabled = false;
            pauseBtn.disabled = true;
            audioFileInput.disabled = false;
        });

        function stopAudioPlaybackOnly() {
            if (sourceNode) {
                try { sourceNode.stop(); } catch(e) {}
                sourceNode.disconnect();
                sourceNode = null;
            }
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            isPlaying = false;
        }

        function stopAudio() {
            stopAudioPlaybackOnly();
            pauseOffset = 0;
            if (playBtn) playBtn.disabled = !audioBuffer;
            if (pauseBtn) pauseBtn.disabled = true;
            if (audioFileInput) audioFileInput.disabled = false;
        }

        function visualize() {
            if (!isPlaying) return;
            animationId = requestAnimationFrame(visualize);

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            const width = canvas.width;
            const height = canvas.height;

            // 1. Shift existing canvas contents 1 pixel to the left (waterfall effect)
            ctx.drawImage(canvas, 1, 0, width - 1, height, 0, 0, width - 1, height);

            // 2. Clear the new 1-pixel column on the right edge
            ctx.fillStyle = '#000000';
            ctx.fillRect(width - 1, 0, 1, height);

            // 3. Draw the new frequency slice
            const binCount = dataArray.length;
            const sliceHeight = height / binCount;

            for (let i = 0; i < binCount; i++) {
                const value = dataArray[i]; // Value from 0 to 255
                
                if (value === 0) continue; // Skip rendering pitch-black pixels for performance

                const color = getHeatmapColor(value);
                ctx.fillStyle = color;

                // Map low frequencies to the bottom, high frequencies to the top
                const y = height - (i + 1) * sliceHeight;
                ctx.fillRect(width - 1, y, 1, Math.ceil(sliceHeight) + 1);
            }
        }

        // Custom colormap function (Black -> Blue -> Cyan -> Yellow -> Red -> White)
        function getHeatmapColor(value) {
            const p = value / 255;
            let r = 0, g = 0, b = 0;

            if (p < 0.25) {
                b = Math.round((p / 0.25) * 255);
            } else if (p < 0.5) {
                b = 255;
                g = Math.round(((p - 0.25) / 0.25) * 255);
            } else if (p < 0.75) {
                b = Math.round((1 - (p - 0.5) / 0.25) * 255);
                g = 255;
                r = Math.round(((p - 0.5) / 0.25) * 255);
            } else {
                r = 255;
                g = 255;
                b = Math.round(((p - 0.75) / 0.25) * 255);
            }

            return `rgb(${r},${g},${b})`;
        }
    </script>
</body>
</html>
