<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Wave Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>WaveForm DAW</h1>
            <p>Upload an audio file to view, edit, and visualize waves</p>
            
            <!-- Top Settings Bar -->
            <div class="settings-bar" style="margin-top: 10px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                <button id="playhead-sb-btn" style="background-color: #2ecc71; color: white;">Playhead Show On SB: ON</button>
                <button id="style-toggle-btn" style="background-color: #7928ca; color: white;">Style: Sensational Bars</button>
            </div>
        </header>

        <main>
            <div class="visualizer-container">
                <canvas id="wave-canvas"></canvas>
            </div>

            <div class="controls">
                <input type="file" id="audio-upload" accept="audio/*, .mp3, .wav, .m4a, .ogg, .aac, .flac">
                <button id="play-btn" disabled>Play</button>
                <button id="pause-btn" disabled>Pause</button>
                <button id="stop-btn" disabled style="background-color: #ff0055; color: white;">Stop</button>
            </div>
        </main>
    </div>

    <!-- Our 5 Scripts -->
    <script src="script1.js"></script>
    <script src="script2.js"></script>
    <script src="script3.js"></script>
    <script src="script4.js"></script>
    <script src="script5.js"></script>
</body>
</html>
