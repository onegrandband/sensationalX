<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Wave Visualizer</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- hCaptcha Script -->
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
</head>
<body>

    <!-- Settings Cog Button -->
    <button id="settings-open-btn" class="icon-btn top-right">
        <i data-lucide="settings"></i>
    </button>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings :3</h2>
                <button id="settings-close-btn" class="icon-btn"><i data-lucide="x"></i></button>
            </div>
            <div class="settings-options">
                <div class="setting-row">
                    <span>Show Playhead</span>
                    <button id="playhead-toggle" class="toggle-btn">ON</button>
                </div>
                <div class="setting-row">
                    <span>Visual Style</span>
                    <button id="style-toggle" class="toggle-btn">Sensational Bars</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div class="app-container">
        <header>
            <h1>WaveForm DAW</h1>
            <p>Upload an audio file to view, edit, and visualize waves</p>
        </header>

        <main>
            <div class="visualizer-container">
                <canvas id="wave-canvas"></canvas>
            </div>

            <div class="controls">
                <input type="file" id="audio-upload" accept="audio/*, .mp3, .wav, .m4a, .ogg, .aac, .flac">
                <button id="play-btn" disabled>Play</button>
                <button id="pause-btn" disabled>Pause</button>
                <button id="stop-btn" disabled style="background-color: #ff0055; color: white;">Stop</button>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="script1.js"></script>
    <script src="script2.js"></script>
    <script src="script3.js"></script>
    <script src="script4.js"></script>
    <script src="script5.js"></script>

    <!-- Initialize Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
