<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Axe Throwing Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #2b3a4a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: linear-gradient(to bottom, #4a6680, #1f2d3a);
            border: 4px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            cursor: crosshair;
        }

        /* Target Boards */
        .target {
            position: absolute;
            top: 150px;
            left: 650px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }

        .ring-1 {
            background-color: #d12c2c; /* Outer ring */
            width: 120px; height: 120px;
            border-radius: 50%;
        }
        .ring-2 {
            background-color: #ffffff; /* Middle ring */
            width: 80px; height: 80px;
            border-radius: 50%;
        }
        .ring-3 {
            background-color: #d12c2c; /* Inner ring */
            width: 50px; height: 50px;
            border-radius: 50%;
        }
        .bullseye {
            background-color: #2b99ff; /* Bullseye */
            width: 20px; height: 20px;
            border-radius: 50%;
        }

        /* The Axe */
        #axe {
            position: absolute;
            width: 40px;
            height: 40px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" viewBox="0 0 100 100"><rect x="40" y="20" width="20" height="60" fill="%238B5A2B"/><path d="M35,20 L65,20 L55,0 L45,0 Z" fill="%23C0C0C0"/><path d="M40,20 L65,55 L40,55 Z" fill="%23808080"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            transform-origin: center center;
            pointer-events: none;
        }

        /* Aim Line */
        #aim-line {
            position: absolute;
            border: 2px dashed #ffff00;
            transform-origin: 0 0;
            pointer-events: none;
            display: none;
        }

        /* UI */
        #scoreboard {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        #instructions {
            margin-top: 10px;
            font-size: 16px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Aiming line -->
        <div id="aim-line"></div>
        
        <!-- Axe -->
        <div id="axe"></div>

        <!-- Target -->
        <div class="target">
            <div class="ring-1">
                <div class="ring-2">
                    <div class="ring-3">
                        <div class="bullseye"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="scoreboard">Score: <span id="score">0</span> | Axes Left: <span id="axes-left">5</span></div>
    <div id="instructions">Click and drag to aim. Release to throw!</div>

    <script>
        const container = document.getElementById('game-container');
        const axe = document.getElementById('axe');
        const aimLine = document.getElementById('aim-line');
        const scoreDisplay = document.getElementById('score');
        const axesLeftDisplay = document.getElementById('axes-left');
        const target = document.querySelector('.target');

        // Game State
        let score = 0;
        let axesLeft = 5;
        let isAiming = false;
        let isFlying = false;
        let startX, startY;

        // Target center
        const targetX = 650 + 60; 
        const targetY = 150 + 60;

        // Reset axe position
        function resetAxe() {
            if (axesLeft > 0) {
                axe.style.display = 'block';
                axe.style.left = '100px';
                axe.style.top = '300px';
                axe.style.transform = 'rotate(0deg)';
                isFlying = false;
            } else {
                alert(`Game Over! Final Score: ${score}`);
                score = 0;
                axesLeft = 5;
                scoreDisplay.textContent = score;
                axesLeftDisplay.textContent = axesLeft;
                resetAxe();
            }
        }

        // Start aiming
        container.addEventListener('mousedown', (e) => {
            if (isFlying || axesLeft <= 0) return;

            // Only allow aiming if clicking near the axe
            const rect = axe.getBoundingClientRect();
            const mouseX = e.clientX - container.getBoundingClientRect().left;
            const mouseY = e.clientY - container.getBoundingClientRect().top;

            if (mouseX >= 50 && mouseX <= 150 && mouseY >= 250 && mouseY <= 350) {
                isAiming = true;
                startX = 120; // Axe start X
                startY = 320; // Axe start Y
                aimLine.style.display = 'block';
                aimLine.style.left = startX + 'px';
                aimLine.style.top = startY + 'px';
            }
        });

        // Update aiming line
        container.addEventListener('mousemove', (e) => {
            if (!isAiming) return;

            const rect = container.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            const dx = currentX - startX;
            const dy = currentY - startY;
            const angle = Math.atan2(dy, dx) * (180 / Math.PI);
            const distance = Math.sqrt(dx * dx + dy * dy);

            aimLine.style.width = distance + 'px';
            aimLine.style.transform = `rotate(${angle}deg)`;
        });

        // Throw the axe
        container.addEventListener('mouseup', (e) => {
            if (!isAiming) return;
            isAiming = false;
            isFlying = true;
            aimLine.style.display = 'none';

            const rect = container.getBoundingClientRect();
            const releaseX = e.clientX - rect.left;
            const releaseY = e.clientY - rect.top;

            let dx = releaseX - startX;
            let dy = releaseY - startY;

            // Throw strength multiplier
            let speed = 1.5;
            let vx = dx * speed;
            let vy = dy * speed;

            // Throw mechanics 
            let posX = startX;
            let posY = startY;
            let rotation = 0;

            let flightInterval = setInterval(() => {
                posX += vx / 10;
                posY += vy / 10;
                rotation += 15; // Spinning effect

                axe.style.left = posX + 'px';
                axe.style.top = posY + 'px';
                axe.style.transform = `rotate(${rotation}deg)`;

                // Boundary check (stop if out of bounds)
                if (posX > 800 || posY < 0 || posY > 600) {
                    clearInterval(flightInterval);
                    axesLeft--;
                    axesLeftDisplay.textContent = axesLeft;
                    checkHit(null);
                    resetAxe();
                }

                // Hit target check
                const hitDist = Math.sqrt((posX - targetX) ** 2 + (posY - targetY) ** 2);
                if (hitDist < 60) {
                    clearInterval(flightInterval);
                    axesLeft--;
                    axesLeftDisplay.textContent = axesLeft;
                    checkHit(hitDist);
                    resetAxe();
                }
            }, 20);
        });

        // Calculate score
        function checkHit(distance) {
            if (distance === null) {
                // Missed
                return;
            }
            
            // Rings are at radii: 60, 40, 25, 10
            if (distance <= 10) {
                score += 7; // Bullseye!
            } else if (distance <= 25) {
                score += 5;
            } else if (distance <= 40) {
                score += 3;
            } else if (distance <= 60) {
                score += 1;
            }
            scoreDisplay.textContent = score;
        }

        resetAxe();
    </script>
</body>
</html>
