<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Not Found | 404</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0e15;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        .container {
            max-width: 600px;
            padding: 20px;
        }

        h1 {
            font-size: 8rem;
            margin: 0;
            color: #ff4d6d;
            font-weight: 900;
        }

        h2 {
            font-size: 1.8rem;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        p {
            color: #a0a5b5;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Audio Wave Animation */
        .audio-wave {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            height: 60px;
            margin-bottom: 40px;
        }

        .wave-bar {
            width: 8px;
            height: 10px;
            background-color: #ff4d6d;
            border-radius: 4px;
            animation: sound 1.5s infinite ease-in-out;
        }

        .wave-bar:nth-child(1) { animation-delay: 0.2s; }
        .wave-bar:nth-child(2) { animation-delay: 0.4s; }
        .wave-bar:nth-child(3) { animation-delay: 0.6s; }
        .wave-bar:nth-child(4) { animation-delay: 0.8s; }
        .wave-bar:nth-child(5) { animation-delay: 0.6s; }
        .wave-bar:nth-child(6) { animation-delay: 0.4s; }
        .wave-bar:nth-child(7) { animation-delay: 0.2s; }

        @keyframes sound {
            0% { height: 10px; }
            50% { height: 50px; }
            100% { height: 10px; }
        }

        /* Home Button */
        .home-btn {
            background-color: #ff4d6d;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background-color 0.2s;
            display: inline-block;
        }

        .home-btn:hover {
            background-color: #e0445f;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>404</h1>
        <h2>Static on the Line</h2>
        
        <!-- Animated Audio Wave -->
        <div class="audio-wave">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
        </div>

        <p>The audio conversation page you are looking for has been disconnected or does not exist. Please double check the link or return home to tune in elsewhere.</p>
        
        <a href="/" class="home-btn">Return Home</a>
    </div>

</body>
</html>
