<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404: Gender Not Found</title>
    <style>
        :root {
            --pink: #ffb5d6;
            --blue: #73deff;
            --white: #ffffff;
            --text-color: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--blue), var(--pink));
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 500px;
            width: 90%;
        }

        .flags {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .flag-bar {
            width: 50px;
            height: 15px;
            border-radius: 4px;
        }

        h1 {
            font-size: 6rem;
            margin: 0;
            color: #313a48;
        }

        h2 {
            font-size: 1.8rem;
            margin: 10px 0;
            color: #555;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #666;
            margin-bottom: 25px;
        }

        .home-button {
            display: inline-block;
            background: #ff75a0;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: background 0.3s ease;
        }

        .home-button:hover {
            background: #ff5287;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Transfem Pride Colors -->
        <div class="flags">
            <div class="flag-bar" style="background-color: var(--blue);"></div>
            <div class="flag-bar" style="background-color: var(--pink);"></div>
            <div class="flag-bar" style="background-color: var(--white);"></div>
            <div class="flag-bar" style="background-color: var(--pink);"></div>
            <div class="flag-bar" style="background-color: var(--blue);"></div>
        </div>

        <h1>404</h1>
        <h2>Gender Not Found</h2>
        <p>Uh oh! The page you are looking for has wandered off. It might have stepped out to go buy a cute skirt, or the URL is incorrect.</p>
        
        <a href="/" class="home-button">Go Back Home</a>
    </div>

</body>
</html>
