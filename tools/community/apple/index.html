<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Catch Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 400px;
            height: 600px;
            background: #90EE90;
            position: relative;
            overflow: hidden;
            border: 4px solid #228B22;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            cursor: none; /* Hides mouse pointer */
        }

        #basket {
            width: 80px;
            height: 30px;
            background: #8B4513;
            position: absolute;
            bottom: 20px;
            left: 160px;
            border-radius: 0 0 15px 15px;
            border: 2px solid #5c2c0c;
        }

        #apple {
            width: 30px;
            height: 30px;
            background: #FF0000;
            position: absolute;
            top: -40px;
            left: 185px;
            border-radius: 50%;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.5);
        }

        #apple::before {
            content: '';
            position: absolute;
            width: 8px;
            height: 15px;
            background: #8B4513;
            top: -10px;
            left: 11px;
            transform: rotate(-15deg);
        }

        #apple::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 8px;
            background: #228B22;
            top: -5px;
            left: 15px;
            border-radius: 50%;
        }

        #score-board {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #000;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            background: #FF4500;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #FF6347;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score-board">Score: 0</div>
    <div id="basket"></div>
    <div id="apple"></div>
    
    <div id="game-over-screen">
        <div>Game Over!</div>
        <button onclick="startGame()">Play Again</button>
    </div>
</div>

<script>
    const container = document.getElementById('game-container');
    const basket = document.getElementById('basket');
    const apple = document.getElementById('apple');
    const scoreBoard = document.getElementById('score-board');
    const gameOverScreen = document.getElementById('game-over-screen');

    let score = 0;
    let appleX = 185;
    let appleY = -40;
    let appleSpeed = 4;
    let basketX = 160;
    let gameInterval;
    let isPlaying = false;

    // Mouse movement
    container.addEventListener('mousemove', (e) => {
        if (!isPlaying) return;
        const rect = container.getBoundingClientRect();
        // Keep basket in the container
        basketX = e.clientX - rect.left - 40; 
        if (basketX < 0) basketX = 0;
        if (basketX > 320) basketX = 320;
        basket.style.left = basketX + 'px';
    });

    // Touch controls for mobile
    container.addEventListener('touchmove', (e) => {
        if (!isPlaying) return;
        const rect = container.getBoundingClientRect();
        basketX = e.touches[0].clientX - rect.left - 40;
        if (basketX < 0) basketX = 0;
        if (basketX > 320) basketX = 320;
        basket.style.left = basketX + 'px';
    });

    function startGame() {
        score = 0;
        appleSpeed = 4;
        scoreBoard.innerText = 'Score: ' + score;
        gameOverScreen.style.display = 'none';
        isPlaying = true;
        resetApple();
        clearInterval(gameInterval);
        gameInterval = setInterval(updateGame, 20);
    }

    function resetApple() {
        appleY = -40;
        // Random spot on the screen
        appleX = Math.floor(Math.random() * 370);
        apple.style.left = appleX + 'px';
    }

    function updateGame() {
        // Move apple down
        appleY += appleSpeed;
        apple.style.top = appleY + 'px';

        // Check for catch
        // Apple bottom hits the basket top
        if (appleY >= 530 && appleY <= 560) {
            // Apple center must be between the basket edges
            let appleCenter = appleX + 15;
            if (appleCenter >= basketX && appleCenter <= basketX + 80) {
                score++;
                scoreBoard.innerText = 'Score: ' + score;
                appleSpeed += 0.2; // Game gets faster
                resetApple();
            }
        }

        // Check for drop
        if (appleY > 600) {
            isPlaying = false;
            clearInterval(gameInterval);
            gameOverScreen.style.display = 'flex';
        }
    }
</script>

</body>
</html>
