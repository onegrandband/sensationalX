<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404: Gender Not Found</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .flag-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .flag-bar {
            width: 80px;
            height: 15px;
            border-radius: 5px;
        }

        /* Transgender Pride Colors */
        .color-blue { background-color: #5BCEFA; }
        .color-pink { background-color: #F5A9B8; }
        .color-white { background-color: #FFFFFF; }

        h1 {
            font-size: 6rem;
            margin: 0 0 10px 0;
            color: #5BCEFA;
            text-shadow: 0 4px 10px rgba(91, 206, 250, 0.3);
        }

        h2 {
            font-size: 2rem;
            margin: 0 0 20px 0;
            color: #FFFFFF;
        }

        p {
            font-size: 1.2rem;
            color: #a0a0a0;
            max-width: 400px;
            margin: 0 auto 30px auto;
            line-height: 1.5;
        }

        a.home-btn {
            background: linear-gradient(135deg, #5BCEFA, #F5A9B8);
            color: #050505;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: inline-block;
        }

        a.home-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(245, 169, 184, 0.4);
        }
    </style>
</head>
<body>

    <!-- Pride Flag Accent -->
    <div class="flag-box">
        <div class="flag-bar color-blue"></div>
        <div class="flag-bar color-pink"></div>
        <div class="flag-bar color-white"></div>
        <div class="flag-bar color-pink"></div>
        <div class="flag-bar color-blue"></div>
    </div>

    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>Oops! The page you were looking for is missing, or its gender was not found. Let's get you back home.</p>
    
    <a href="/" class="home-btn">Return Home</a>

</body>
</html>
