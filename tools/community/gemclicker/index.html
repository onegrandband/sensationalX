<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Gem Clicker :3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Left Side: The Main Game -->
        <div id="clicker-section">
            <h1 id="title">Gem Clicker</h1>
            
            <div id="score-board">
                <h2>Gems: <span id="gem-count">0</span></h2>
                <p>Gems per second: <span id="gps-count">0</span></p>
                <p id="prestige-multiplier-display" style="color: #f1c40f; display: none; font-size: 0.9em; margin-top: 5px;">Prestige Multiplier: x<span id="mult-count">1</span></p>
            </div>

            <div id="gem-container">
                <div id="main-gem" class="skin-default"></div>
            </div>
        </div>

        <!-- Right Side: The Menus -->
        <div id="menu-section">
            <div id="tabs">
                <button class="tab-btn active" id="tab-upgrades">Upgrades</button>
                <button class="tab-btn" id="tab-skins">Skins</button>
                <button class="tab-btn" id="tab-themes">Themes</button>
                <button class="tab-btn" id="tab-achievements">Trophies</button>
                <button class="tab-btn" id="tab-prestige">Prestige</button>
                <button class="tab-btn" id="tab-stats">Stats</button>
            </div>

            <!-- Upgrades Shop (script2.js) -->
            <div id="shop-upgrades" class="shop-panel active">
                <h3>Upgrade Shop</h3>
                <div id="upgrades-list"></div>
            </div>

            <!-- Skins Shop (script3.js) -->
            <div id="shop-skins" class="shop-panel">
                <h3>Skin Shop</h3>
                <div id="skins-list"></div>
            </div>

            <!-- Themes Customizer (script5.js) -->
            <div id="shop-themes" class="shop-panel">
                <h3>Theme Customizer</h3>
                <div class="shop-item">
                    <div class="shop-item-info"><h4>Dark Mode (Default)</h4></div>
                    <button class="equip-btn" onclick="setTheme('dark')">Apply</button>
                </div>
                <div class="shop-item">
                    <div class="shop-item-info"><h4>Light Mode</h4></div>
                    <button class="equip-btn" style="background:#3498db;" onclick="setTheme('light')">Apply</button>
                </div>
                <div class="shop-item">
                    <div class="shop-item-info"><h4>Neon Hacker Mode</h4></div>
                    <button class="equip-btn" style="background:#2ecc71;" onclick="setTheme('neon')">Apply</button>
                </div>
            </div>

            <!-- Achievements (script6.js) -->
            <div id="shop-achievements" class="shop-panel">
                <h3>Trophies & Achievements</h3>
                <div id="achievements-list"></div>
            </div>

            <!-- Prestige (script7.js) -->
            <div id="shop-prestige" class="shop-panel">
                <h3>Prestige System</h3>
                <p style="text-align:center; margin-bottom:15px;">Reset your gems and upgrades to gain a permanent multiplier!</p>
                <div id="prestige-info"></div>
            </div>

            <!-- Stats (script8.js) -->
            <div id="shop-stats" class="shop-panel">
                <h3>Game Statistics</h3>
                <div id="stats-list"></div>
            </div>
        </div>
    </div>

    <!-- The Footer -->
    <div id="footer">Made by (USER) :3</div>

    <!-- Notification Toast Container -->
    <div id="toast-container"></div>

    <!-- Scripts (Order Matters!) -->
    <script src="script.js"></script>
    <script src="script2.js"></script>
    <script src="script3.js"></script>
    <script src="script4.js"></script>
    <script src="script5.js"></script>
    <script src="script6.js"></script>
    <script src="script7.js"></script>
    <script src="script8.js"></script>
</body>
</html>
