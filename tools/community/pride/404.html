<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FF7675, #74B9FF, #55EFC4, #FFEAA7, #A8B8FF);
            background-size: 400% 400%;
            animation: gradientShift 10s ease infinite;
            color: #2D3436;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50% }
            50% { background-position: 100% 50% }
            100% { background-position: 0% 50% }
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 8rem;
            margin: 0;
            color: #FF7675;
            text-shadow: 2px 2px 0px #DFE6E9;
        }

        h2 {
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: #2D3436;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #636E72;
            margin-bottom: 30px;
        }

        .home-btn {
            display: inline-block;
            background: #0984E3;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(9, 132, 227, 0.4);
        }

        .home-btn:hover {
            background: #74B9FF;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>404</h1>
        <h2>Oops! You've wandered off the path.</h2>
        <p>We couldn't find the page you were looking for. Don't worry though, we still love you for who you are! Let's get you back to the main celebration.</p>
        <a href="/" class="home-btn">Go Home</a>
    </div>

</body>
</html>
