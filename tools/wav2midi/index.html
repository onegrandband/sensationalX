<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAV to MIDI Converter & Editor</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tone.js Library for Grand Piano Playback -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>WAV to MIDI Converter & Editor</h1>
            <p>Real Web Audio API pitch tracking, interactive piano roll, grand piano sound engine, and export.</p>
        </header>

        <main>
            <!-- Native Label Wrapper for 100% Reliable Mobile/iOS File Selection -->
            <label class="upload-card" for="audioFile">
                <input type="file" id="audioFile" class="file-input" accept="audio/wav,audio/x-wav,.wav">
                <div class="upload-content">
                    <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p id="fileLabel">Tap here to choose your WAV file, or <span class="browse-btn">browse</span></p>
                    <span class="file-format">Supports uncompressed PCM .wav files</span>
                </div>
            </label>

            <!-- Controls Section -->
            <div class="controls-section">
                <div class="setting-group">
                    <label for="sensitivity">Detection Sensitivity:</label>
                    <input type="range" id="sensitivity" min="1" max="10" value="5">
                    <span id="sensitivityValue">5</span>
                </div>
                <button id="convertBtn" class="primary-btn" disabled>Convert & Open Editor</button>
            </div>

            <!-- Progress Indicator -->
            <div class="progress-container" id="progressContainer" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p id="statusText">Analyzing audio waveform...</p>
            </div>

            <!-- MIDI Editor & Preview Section -->
            <div class="editor-section" id="editorSection" style="display: none;">
                <h3>Grand Piano Editor & Preview</h3>
                <p id="editorStats">Notes: 0</p>
                
                <!-- Piano Roll Canvas Visualizer -->
                <div class="canvas-container">
                    <canvas id="pianoRollCanvas" width="460" height="150"></canvas>
                </div>

                <!-- Playback Controls -->
                <div class="playback-controls">
                    <button id="playBtn" class="secondary-btn">▶ Play Preview</button>
                    <button id="stopBtn" class="secondary-btn" disabled>⏹ Stop</button>
                </div>

                <!-- Download Section -->
                <button id="downloadBtn" class="success-btn">Download MIDI File (.mid)</button>
            </div>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
