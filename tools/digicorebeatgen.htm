<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensationalX AI Digicore Generator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = { darkMode: 'class' }
        // Theme init
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-[#0b0b0c] text-gray-900 dark:text-white font-sans antialiased transition-colors duration-300 min-h-screen flex flex-col">

    <header class="flex items-center justify-between border-b border-gray-200 dark:border-[#2a2a2e] bg-white dark:bg-[#1c1c1f] px-[8%] py-4 sticky top-0 z-40 transition-colors">
        <div class="text-xl font-extrabold tracking-widest uppercase flex items-center gap-2">
            <span class="text-[#ff3366]">SX</span> Digicore Forge
            <i data-lucide="cpu" class="w-5 h-5 text-[#ff3366]"></i>
        </div>
        <nav class="flex items-center gap-6">
            <a href="../index.html" class="text-sm font-bold uppercase tracking-wider text-gray-500 hover:text-[#ff3366] transition-colors">Home</a>
            <button onclick="toggleTheme()" class="text-gray-500 hover:text-black dark:text-gray-400 dark:hover:text-white transition-colors">
                <i id="themeIcon" data-lucide="moon" class="w-5 h-5"></i>
            </button>
        </nav>
    </header>

    <main class="flex-1 px-[8%] py-12 flex items-center justify-center">
        
        <div class="w-full max-w-xl p-8 rounded-3xl border border-gray-200 dark:border-[#2a2a2e] bg-white dark:bg-[#1c1c1f] shadow-xl shadow-[#ff3366]/5 transition-colors">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black mb-2">AI Digicore Generator</h1>
                <p class="text-gray-500 dark:text-gray-400 text-sm">Input an aesthetic prompt or select a sub-style to synthesize bitcrushed chiptune riffs and 808-heavy trap beats.</p>
            </div>

            <div class="space-y-5">
                <div>
                    <label for="aiPrompt" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2 uppercase tracking-wide">Aesthetic & Vibe Prompt</label>
                    <div class="relative">
                        <i data-lucide="terminal" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                        <input type="text" id="aiPrompt" placeholder="e.g. distorted plugg 808s, internet-core virtual melody, pitch-bent arcade leads..." 
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 dark:border-[#2a2a2e] bg-gray-50 dark:bg-[#0b0b0c] focus:outline-none focus:border-[#ff3366] dark:focus:border-[#ff3366] transition-colors text-gray-900 dark:text-white font-medium">
                    </div>
                </div>

                <div>
                    <label for="styleSelect" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2 uppercase tracking-wide">Digicore Audio Profile</label>
                    <select id="styleSelect" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-[#2a2a2e] bg-gray-50 dark:bg-[#0b0b0c] focus:outline-none focus:border-[#ff3366] dark:focus:border-[#ff3366] transition-colors text-gray-900 dark:text-white cursor-pointer font-medium">
                        <option value="virtual">Virtual-Pop / Bright Chiptune</option>
                        <option value="pluggcore">Pluggcore / Ambient Trap Mix</option>
                        <option value="glitchcore">Heavy Bitcrush / Glitch-Pop</option>
                    </select>
                </div>

                <button onclick="generateDigicoreTrack()" id="generateBtn" class="w-full mt-2 py-4 rounded-xl bg-[#ff3366]/10 text-[#ff3366] font-bold uppercase tracking-wider hover:bg-[#ff3366] hover:text-white transition-all duration-300 flex items-center justify-center gap-2 group">
                    <i data-lucide="code-2" class="w-5 h-5 transition-transform group-hover:scale-110"></i>
                    <span id="btnText">Compile Digital Sequence</span>
                </button>
            </div>

            <div id="playerConsole" class="mt-8 p-6 rounded-2xl bg-gray-50 dark:bg-[#0b0b0c] border border-gray-200 dark:border-[#2a2a2e] hidden transition-all">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <span id="metaGenre" class="text-xs font-bold uppercase tracking-widest text-[#ff3366]">VIRTUAL PROFILE</span>
                        <h3 id="metaSeed" class="text-lg font-black tracking-tight text-gray-900 dark:text-white">Digi_Patch_01.wav</h3>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-mono bg-gray-200 dark:bg-[#1c1c1f] px-2 py-1 rounded text-gray-500 dark:text-gray-400" id="bpmDisplay">145 BPM</span>
                    </div>
                </div>

                <div class="flex items-end justify-between gap-1 h-16 px-4 mb-6 bg-white dark:bg-[#1c1c1f] rounded-xl border border-gray-200 dark:border-[#2a2a2e] overflow-hidden">
                    <div class="v-bar w-full bg-gray-200 dark:bg-[#2a2a2e] h-1 rounded-t transition-all duration-100"></div>
                    <div class="v-bar w-full bg-[#ff3366]/40 h-6 rounded-t transition-all duration-100"></div>
                    <div class="v-bar w-full bg-[#ff3366] h-12 rounded-t transition-all duration-100"></div>
                    <div class="v-bar w-full bg-[#ff3366]/70 h-3 rounded-t transition-all duration-100"></div>
                    <div class="v-bar w-full bg-gray-200 dark:bg-[#2a2a2e] h-2 rounded-t transition-all duration-100"></div>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="togglePlayback()" id="playPauseBtn" class="flex-1 py-3 rounded-xl bg-gray-900 text-white dark:bg-white dark:text-black font-bold uppercase tracking-wide text-sm flex items-center justify-center gap-2 hover:opacity-90 transition-opacity">
                        <i data-lucide="play" class="w-4 h-4 fill-current"></i> Launch Audio Thread
                    </button>
                </div>
            </div>

        </div>
    </main>

    <script>
        // --- THEME LOGIC ---
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        });

        // --- WEB AUDIO API PROCEDURAL DIGICORE ENGINE ---
        let audioCtx = null;
        let isPlaying = false;
        let currentStep = 0;
        let sequencerInterval = null;
        let bpm = 140;

        let activeScale = [];
        let patterns = { kick808: [], snare: [], hihat: [], synthLead: [] };

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Booming Distorted 808 Trap Kick
        function play808Kick(time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = "triangle";
            osc.frequency.setValueAtTime(150, time);
            osc.frequency.exponentialRampToValueAtTime(38, time + 0.15);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            gain.gain.setValueAtTime(1.3, time);
            gain.gain.linearRampToValueAtTime(0.7, time + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.35); // Extended 808 tail decay

            osc.start(time);
            osc.stop(time + 0.38);
        }

        // Sharp Digital Trap Snare
        function playTrapSnare(time) {
            const bufferSize = audioCtx.sampleRate * 0.08;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = "highpass";
            filter.frequency.value = 1800;

            const gain = audioCtx.createGain();
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            gain.gain.setValueAtTime(0.55, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.08);

            noise.start(time);
            noise.stop(time + 0.09);
        }

        // High-Speed Tight Trap Hi-Hats
        function playTrapHat(time, volume = 0.25) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = "square";
            osc.frequency.setValueAtTime(10000, time); // High metal frequency

            const filter = audioCtx.createBiquadFilter();
            filter.type = "bandpass";
            filter.frequency.value = 8000;

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            gain.gain.setValueAtTime(volume, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.03);

            osc.start(time);
            osc.stop(time + 0.04);
        }

        // Glitchy Pitch-Slipping Square Wave Chiptune Lead
        function playDigiLead(time, freq) {
            if (freq === 0) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = "square";
            osc.frequency.setValueAtTime(freq, time);
            
            // Retro chiptune pitch slide (portamento simulation)
            if (Math.random() > 0.5) {
                osc.frequency.linearRampToValueAtTime(freq * 2, time + 0.06); // Quick octave skip glide
            }

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            gain.gain.setValueAtTime(0.12, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.14);

            osc.start(time);
            osc.stop(time + 0.15);
        }

        // Engine Configuration Matrix Compiler
        function generateDigicoreTrack() {
            initAudio();
            stopBeat();

            const profile = document.getElementById('styleSelect').value;
            const prompt = document.getElementById('aiPrompt').value;
            const btnText = document.getElementById('btnText');
            const generateBtn = document.getElementById('generateBtn');

            generateBtn.disabled = true;
            btnText.innerText = "Injecting Chiptune Logic...";

            setTimeout(() => {
                // Procedural Style Mapping
                if (profile === 'virtual') {
                    bpm = 148;
                    activeScale = [587.33, 659.25, 783.99, 880.00, 1174.66]; // Sweet D Major Pentatonic (D5 - D6)
                } else if (profile === 'pluggcore') {
                    bpm = 130;
                    activeScale = [440.00, 523.25, 587.33, 698.46, 783.99]; // Dreamy A Minor Ambient Pentatonic
                } else if (profile === 'glitchcore') {
                    bpm = 160;
                    activeScale = [466.16, 554.37, 622.25, 698.46, 830.61]; // Moody A# Minor Pentatonic Band
                }

                // Compile 16-step grid sequences
                for (let i = 0; i < 16; i++) {
                    patterns.kick808[i] = (i === 0 || i === 8 || i === 11 || (profile === 'glitchcore' && Math.random() > 0.7)) ? 1 : 0;
                    patterns.snare[i] = (i === 4 || i === 12) ? 1 : 0;
                    
                    // Rapid hi-hat rolling patterns
                    if (i % 2 === 0) {
                        patterns.hihat[i] = 1; // Straight hats
                    } else {
                        patterns.hihat[i] = (profile === 'glitchcore' || Math.random() > 0.6) ? 2 : 0; // 2 denotes rapid stutter triplet hat roll
                    }

                    // Procedural digital arpeggiator step compiler
                    patterns.synthLead[i] = (i % 2 === 0 || Math.random() > 0.4) 
                        ? activeScale[Math.floor(Math.random() * activeScale.length)] 
                        : 0;
                }

                // Render UI Layout state changes
                document.getElementById('metaGenre').innerText = `${profile.toUpperCase()} PROFILE`;
                document.getElementById('metaSeed').innerText = prompt ? `"${prompt.substring(0, 24)}..."` : `Digi_Core_${Math.floor(Math.random() * 8999 + 1000)}.wav`;
                document.getElementById('bpmDisplay').innerText = `${bpm} BPM`;

                generateBtn.disabled = false;
                btnText.innerText = "Compile Digital Sequence";
                document.getElementById('playerConsole').classList.remove('hidden');

                startBeat();
            }, 1000);
        }

        // Loop Sequencer Internal Core Logic
        function stepSequencer() {
            const stepDuration = 60 / bpm / 4; 
            const time = audioCtx.currentTime;

            if (patterns.kick808[currentStep]) play808Kick(time);
            if (patterns.snare[currentStep]) playTrapSnare(time);
            
            if (patterns.hihat[currentStep] === 1) {
                playTrapHat(time);
            } else if (patterns.hihat[currentStep] === 2) {
                // Synthesize rapid fire 32nd note hi-hat rolls
                playTrapHat(time, 0.22);
                playTrapHat(time + (stepDuration / 2), 0.18);
            }

            if (patterns.synthLead[currentStep]) {
                playDigiLead(time, patterns.synthLead[currentStep]);
            }

            // Interface Dashboard Node Animations
            const bars = document.querySelectorAll('.v-bar');
            bars.forEach(bar => {
                const bounceHeight = Math.random() * 52 + 4;
                bar.style.height = `${bounceHeight}px`;
            });

            currentStep = (currentStep + 1) % 16;
        }

        function startBeat() {
            if (isPlaying) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            isPlaying = true;
            currentStep = 0;
            
            const intervalMs = (60 / bpm / 4) * 1000;
            sequencerInterval = setInterval(stepSequencer, intervalMs);

            document.getElementById('playPauseBtn').innerHTML = `<i data-lucide="square" class="w-4 h-4 fill-current"></i> Terminate Thread`;
            lucide.createIcons();
        }

        function stopBeat() {
            isPlaying = false;
            clearInterval(sequencerInterval);
            const bars = document.querySelectorAll('.v-bar');
            bars.forEach(bar => bar.style.height = `4px`);
            document.getElementById('playPauseBtn').innerHTML = `<i data-lucide="play" class="w-4 h-4 fill-current"></i> Launch Audio Thread`;
            lucide.createIcons();
        }

        function togglePlayback() {
            if (isPlaying) stopBeat();
            else startBeat();
        }
    </script>
</body>
</html>
