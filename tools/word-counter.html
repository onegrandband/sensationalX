<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensationalX Word & Character Counter</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = { darkMode: 'class' }
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>

<body class="bg-gray-50 dark:bg-[#0b0b0c] text-gray-900 dark:text-white font-sans antialiased transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="flex items-center justify-between border-b border-gray-200 dark:border-[#2a2a2e] bg-white dark:bg-[#1c1c1f] px-[8%] py-4 sticky top-0 z-40 transition-colors">
        <div class="text-xl font-extrabold tracking-widest uppercase flex items-center gap-2">
            <span class="text-[#ff3366]">SX</span> COUNTER
            <i data-lucide="sparkles" class="w-5 h-5 text-[#ff3366]"></i>
        </div>
        <nav class="flex items-center gap-6">
            <a href="../index.html" class="text-sm font-bold uppercase tracking-wider text-gray-500 hover:text-[#ff3366] transition-colors">Home</a>
            <a href="../tools" class="text-sm font-bold uppercase tracking-wider text-gray-500 hover:text-[#ff3366] transition-colors">Tools</a>
            <button onclick="toggleTheme()" class="text-gray-500 hover:text-black dark:text-gray-400 dark:hover:text-white transition-colors cursor-pointer">
                <i id="themeIcon" data-lucide="moon" class="w-5 h-5"></i>
            </button>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center p-5">
        <div class="w-full max-w-2xl bg-white dark:bg-[#1c1c1f] p-8 rounded-2xl border border-gray-200 dark:border-[#2a2a2e] shadow-xl text-center">
            
            <h2 class="font-bold text-2xl mb-6 text-gray-900 dark:text-white">Word & Character Counter</h2>
            
            <textarea id="textInput" class="w-full h-48 p-4 border border-gray-300 dark:border-[#2a2a2e] bg-gray-50 dark:bg-[#0b0b0c] rounded-xl focus:outline-none focus:border-[#ff3366] dark:focus:border-[#ff3366] transition-colors resize-none mb-6 placeholder-gray-400 dark:placeholder-gray-500" oninput="countText()" placeholder="Type or paste your text here..."></textarea>
            
            <div class="flex justify-center gap-8 text-lg font-bold">
                <p class="text-gray-700 dark:text-gray-300">Words: <span id="wordCount" class="text-[#ff3366]">0</span></p>
                <p class="text-gray-700 dark:text-gray-300">Characters: <span id="charCount" class="text-[#ff3366]">0</span></p>
            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script>
        // Theme Toggle Logic
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        });

        // Word & Character Count Logic
        function countText() {
            const text = document.getElementById('textInput').value;
            // Count characters including spaces
            document.getElementById('charCount').innerText = text.length;
            
            // Count words based on whitespace separation
            const words = text.trim().split(/\s+/).filter(w => w.length > 0);
            document.getElementById('wordCount').innerText = words.length;
        }
    </script>
</body>
</html>
