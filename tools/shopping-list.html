<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #2c2927;
            background-image: radial-gradient(#4a4440 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            font-family: 'Kalam', cursive;
            min-height: 100vh;
        }


        .paper-wrapper {
            filter: drop-shadow(0 12px 15px rgba(0, 0, 0, 0.5));
            width: 100%;
            max-width: 450px;

            transform: rotate(-1.5deg); 
            height: max-content;
        }

        .paper {
            background-color: #fdfae9;
            position: relative;
            padding: 50px 20px 40px 60px;
            min-height: 300px;
            
            background-image: repeating-linear-gradient(
                transparent, 
                transparent 31px, 
                #a6c0e5 31px, 
                #a6c0e5 32px
            );
            background-position: top;
        }
        .paper::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 45px;
            width: 2px;
            background-color: #ff9e9e;
            z-index: 1;
        }

        .paper::after {
            content: '';
            position: absolute;
            bottom: -15px; 
            left: 0;
            width: 100%;
            height: 15px;
            background: 
                linear-gradient(-45deg, transparent 10.5px, #fdfae9 0),
                linear-gradient(45deg, transparent 10.5px, #fdfae9 0);
            background-repeat: repeat-x;
            background-size: 22px 20px;
            background-position: left bottom;
        }

        h1 {
            margin: 0;
            margin-top: -15px;
            padding-bottom: 12px;
            font-size: 2rem;
            color: #333;
            letter-spacing: 1px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            position: relative;
            z-index: 2;
        }

        li {
            height: 32px;
            display: flex;
            align-items: center;
            font-size: 1.3rem;
            color: #222;
        }

        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #555;
            border-radius: 3px;
            margin-right: 15px;
            cursor: pointer;
            position: relative;
            display: inline-block;
            background: transparent;
        }

        input[type="checkbox"]:checked::after {
            content: '✔';
            position: absolute;
            top: -10px;
            left: -2px;
            font-size: 22px;
            color: #d12e2e;
            font-family: 'Kalam', cursive;
        }

        input[type="checkbox"]:checked + span {
            text-decoration: line-through;
            color: #888;
        }

        /* Add Item Section */
        .add-item-container {
            display: flex;
            margin-top: 10px;
            height: 32px;
            position: relative;
            z-index: 2;
        }

        input[type="text"] {
            background: transparent;
            border: none;
            outline: none;
            font-family: 'Kalam', cursive;
            font-size: 1.3rem;
            flex-grow: 1;
            color: #222;
            padding: 0;
        }

        input[type="text"]::placeholder {
            color: #aaa;
            opacity: 0.7;
        }

        button {
            background: transparent;
            border: 2px dashed #a6c0e5;
            color: #555;
            font-family: 'Kalam', cursive;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 5px;
            margin-left: 10px;
            padding: 0 10px;
            transition: 0.2s;
        }

        button:hover {
            background: #a6c0e5;
            color: #fff;
            border-style: solid;
        }
    </style>
</head>
<body>

    <div class="paper-wrapper">
        <div class="paper">
            <h1>Shopping List</h1>
            
            <ul id="list"></ul>

            <div class="add-item-container">
                <input type="text" id="new-item" placeholder="Write a new item here..." autocomplete="off">
                <button id="add-btn">Add</button>
            </div>
        </div>
    </div>

    <script>
        const inputField = document.getElementById('new-item');
        const addButton = document.getElementById('add-btn');
        const list = document.getElementById('list');

        // 1. Function to save the current list to LocalStorage
        function saveList() {
            const items = [];
            const listElements = list.querySelectorAll('li');
            
            listElements.forEach(li => {
                const checkbox = li.querySelector('input[type="checkbox"]');
                const span = li.querySelector('span');
                items.push({
                    text: span.textContent,
                    checked: checkbox.checked
                });
            });
            
            localStorage.setItem('groceryList', JSON.stringify(items));
        }

        // 2. Function to build the HTML for a single item
        function createItemDOM(text, isChecked = false) {
            const li = document.createElement('li');
            
            const label = document.createElement('label');
            label.style.display = 'flex';
            label.style.alignItems = 'center';
            label.style.cursor = 'pointer';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = isChecked;

            const span = document.createElement('span');
            span.textContent = text;

            label.appendChild(checkbox);
            label.appendChild(span);
            li.appendChild(label);
            list.appendChild(li);
        }

        // 3. Function to load data from LocalStorage on page load
        function loadList() {
            const savedList = localStorage.getItem('groceryList');
            
            if (savedList) {
                // Parse the saved JSON string back into an array
                const parsedList = JSON.parse(savedList);
                parsedList.forEach(item => {
                    createItemDOM(item.text, item.checked);
                });
            } else {
                // Default items if visiting for the very first time
                createItemDOM('Apples', false);
                createItemDOM('Milk', false);
                saveList(); // Save defaults
            }
        }

        // 4. Handle Adding a New Item
        function handleAddItem() {
            const itemText = inputField.value.trim();
            if (itemText === '') return;

            createItemDOM(itemText);
            saveList(); // Save the new data

            inputField.value = '';
        }

        // --- EVENT LISTENERS ---

        // Listen for Add Button click
        addButton.addEventListener('click', handleAddItem);

        // Listen for "Enter" key press
        inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleAddItem();
            }
        });

        // Listen for ANY checkbox being clicked in the list
        // (This is called Event Delegation, allowing us to listen to dynamic items)
        list.addEventListener('change', function(e) {
            if (e.target.type === 'checkbox') {
                saveList(); // Resave the list with the new checked status
            }
        });

        // Initialize the app when the page loads
        loadList();
    </script>
</body>
</html>
