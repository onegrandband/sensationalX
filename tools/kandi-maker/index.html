<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 🌟 Added Content-Security-Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">
    <title>Kandi Bracelet Maker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header style="display: flex; justify-content: space-between; align-items: center; position: relative; margin-bottom: 20px;">
            <h1 style="margin: 0 auto; text-align: center;">Kandi Bracelet Maker</h1>
        </header>
        
        <main>
            <!-- The string where the beads sit -->
            <div class="bracelet-container">
                <div class="string"></div>
                <div id="bracelet-display" class="bracelet-display">
                    <!-- Beads will be rendered here by JS -->
                </div>
            </div>

            <!-- Controls and Palette -->
            <div class="controls">
                <div id="color-palette" class="palette"></div>
                
                <div class="actions">
                    <button id="add-bead-btn">Add Bead</button>
                    <button id="remove-bead-btn">Remove Last</button>
                    <button id="clear-btn">Clear String</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Main entry point script (handles all module initialization safely) -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
