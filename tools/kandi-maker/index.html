<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kandi Bracelet Maker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header style="display: flex; justify-content: space-between; align-items: center; position: relative; margin-bottom: 20px;">
            <h1 style="margin: 0 auto; text-align: center;">Kandi Bracelet Maker</h1>
            <button id="visit-store-btn" style="position: absolute; right: 0; background: #ff007f; color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85rem; box-shadow: 0 0 10px rgba(255,0,127,0.4);">Visit Craft Store</button>
        </header>
        
        <main>
            <!-- The string where the beads sit -->
            <div class="bracelet-container">
                <div class="string"></div>
                <div id="bracelet-display" class="bracelet-display">
                    <!-- Beads will be rendered here by JS -->
                </div>
            </div>

            <!-- Controls and Palette -->
            <div class="controls">
                <div id="color-palette" class="palette"></div>
                
                <div class="actions">
                    <button id="add-bead-btn">Add Bead</button>
                    <button id="remove-bead-btn">Remove Last</button>
                    <button id="clear-btn">Clear String</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Main entry point script -->
    <script type="module" src="js/ui.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
