<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloader | SensationalX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-[#0b0b0c] text-gray-900 dark:text-white font-sans antialiased transition-colors duration-300 min-h-screen">

    <audio id="audioEngine" preload="none"></audio>

    <!-- Header -->
    <header class="flex items-center justify-between border-b border-gray-200 dark:border-[#2a2a2e] bg-white dark:bg-[#1c1c1f] px-[8%] py-4 sticky top-0 z-40">
        <div class="text-xl font-extrabold tracking-widest uppercase"><span class="text-[#ff3366]">SX</span> Downloader</div>
        <button onclick="toggleTheme()" class="text-gray-500 dark:text-gray-400"><i id="themeIcon" data-lucide="moon" class="w-5 h-5"></i></button>
    </header>

    <main class="px-[8%] py-12 max-w-4xl mx-auto">
        
        <!-- NEW: Text Customization Box -->
        <div class="bg-white dark:bg-[#1c1c1f] p-6 rounded-2xl border border-gray-200 dark:border-[#2a2a2e] mb-10 shadow-sm">
            <h2 class="text-lg font-bold mb-4 uppercase tracking-wider text-gray-400">Text Previewer</h2>
            <input type="text" id="customTextInput" placeholder="Type something here..." 
                   class="w-full bg-gray-100 dark:bg-[#0b0b0c] p-3 rounded-lg mb-4 outline-none border border-transparent focus:border-[#ff3366] transition-all">
            <div class="flex items-center gap-4">
                <span class="text-sm font-bold">Size:</span>
                <input type="range" id="sizeSlider" min="12" max="72" value="24" class="w-full h-2 bg-gray-200 dark:bg-[#2a2a2e] rounded-lg appearance-none cursor-pointer accent-[#ff3366]">
            </div>
            <div id="previewText" class="mt-6 font-bold break-words transition-all duration-75">Your text will appear here</div>
        </div>

        <!-- Artist Tabs -->
        <div class="flex gap-3 mb-10 border-b border-gray-200 dark:border-[#2a2a2e] pb-6">
            <button onclick="switchArtist('ogb')" id="tab-ogb" class="artist-tab px-6 py-2.5 rounded-full font-bold text-sm bg-[#ff3366] text-white">One Grand Band</button>
            <button onclick="switchArtist('sonic')" id="tab-sonic" class="artist-tab px-6 py-2.5 rounded-full font-bold text-sm bg-gray-200 dark:bg-[#1c1c1f]">Sonic Phantom</button>
            <button onclick="switchArtist('redlines')" id="tab-redlines" class="artist-tab px-6 py-2.5 rounded-full font-bold text-sm bg-gray-200 dark:bg-[#1c1c1f]">The Redlines</button>
        </div>

        <div id="dynamicContent" class="animate-fade-in"></div>
    </main>

    <!-- Mini Player -->
    <div id="miniPlayer" class="fixed bottom-0 left-0 right-0 border-t border-gray-200 dark:border-[#2a2a2e] bg-white/95 dark:bg-[#0b0b0c]/95 backdrop-blur-md p-4 transform translate-y-full transition-transform duration-300 z-40 flex justify-between items-center px-[8%]">
        <div class="flex items-center gap-4">
            <button onclick="togglePlay()" class="h-10 w-10 flex items-center justify-center bg-[#ff3366] text-white rounded-full"><i id="playIcon" data-lucide="pause" class="w-5 h-5"></i></button>
            <div>
                <p id="nowPlayingTitle" class="font-bold text-sm">Track Title</p>
                <p class="text-xs text-[#ff3366]">Now Playing</p>
            </div>
        </div>
        <button onclick="stopPlay()" class="text-gray-500 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>

    <script>
        // --- Text Customization Logic ---
        const textInput = document.getElementById('customTextInput');
        const sizeSlider = document.getElementById('sizeSlider');
        const previewText = document.getElementById('previewText');

        textInput.addEventListener('input', (e) => previewText.textContent = e.target.value);
        sizeSlider.addEventListener('input', (e) => previewText.style.fontSize = e.target.value + 'px');

        // --- Existing Logic (Tabs/Audio/Download) ---
        const audio = document.getElementById('audioEngine');
        const isTouchDevice = window.matchMedia("(pointer: coarse)").matches;

        function switchArtist(id) {
            document.querySelectorAll('.artist-tab').forEach(t => t.classList.replace('bg-[#ff3366]', 'bg-gray-200'));
            document.getElementById(`tab-${id}`).classList.replace('bg-gray-200', 'bg-[#ff3366]');
            
            const content = document.getElementById('dynamicContent');
            if(id === 'ogb') {
                content.innerHTML = `<!-- Tracklist Code Here -->`; // (Keep your existing tracklist renderer)
            } else {
                content.innerHTML = `<h2 class="text-3xl font-black">Songs Featured in One Grand Band</h2>`;
            }
            lucide.createIcons();
        }

        function playPreview(title, url) {
            document.getElementById('nowPlayingTitle').textContent = title;
            audio.src = url;
            audio.play();
            document.getElementById('miniPlayer').classList.remove('translate-y-full');
        }

        function stopPlay() {
            audio.pause();
            document.getElementById('miniPlayer').classList.add('translate-y-full');
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            document.getElementById('themeIcon').setAttribute('data-lucide', document.documentElement.classList.contains('dark') ? 'moon' : 'sun');
            lucide.createIcons();
        }

        lucide.createIcons();
    </script>
</body>
</html>
