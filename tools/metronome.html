<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metronome</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- Responsive Container -->
    <div class="w-full max-w-sm bg-white rounded-xl shadow-md p-6 text-center box-border">
        <h2 class="font-bold text-2xl text-gray-800 mb-4">Metronome</h2>
        
        <div class="flex flex-col items-center gap-3">
            <label for="bpmInput" class="text-sm font-medium text-gray-600">Beats Per Minute (BPM)</label>
            <input type="number" id="bpmInput" value="120" min="40" max="300" class="w-full max-w-[150px] border border-gray-300 rounded p-2 text-center text-lg focus:outline-none focus:ring-2 focus:ring-[#ff3366]" />
            
            <button onclick="toggleMetronome()" id="playBtn" class="w-full max-w-[150px] bg-[#ff3366] hover:bg-[#e02855] text-white font-semibold px-4 py-3 rounded-lg shadow-sm transition-colors mt-2 cursor-pointer">
                Start
            </button>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let isPlaying = false;
        let timerID;

        function playClick() {
            // AudioContext must be resumed or created after a user gesture
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            osc.connect(audioCtx.destination);
            osc.frequency.value = 1000;
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function toggleMetronome() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('playBtn');
            if (isPlaying) {
                btn.innerText = "Stop";
                let bpm = document.getElementById('bpmInput').value || 120;
                let interval = 60000 / bpm;
                
                // Play first click immediately, then start interval
                playClick(); 
                timerID = setInterval(playClick, interval);
            } else {
                btn.innerText = "Start";
                clearInterval(timerID);
            }
        }
    </script>

</body>
</html>
