<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensationalX AI Hyperpop Generator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = { darkMode: 'class' }
        // Theme init
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-[#0b0b0c] text-gray-900 dark:text-white font-sans antialiased transition-colors duration-300 min-h-screen flex flex-col">

    <header class="flex items-center justify-between border-b border-gray-200 dark:border-[#2a2a2e] bg-white dark:bg-[#1c1c1f] px-[8%] py-4 sticky top-0 z-40 transition-colors">
        <div class="text-xl font-extrabold tracking-widest uppercase flex items-center gap-2">
            <span class="text-[#ff3366]">SX</span> Glitch Lab
            <i data-lucide="zap" class="w-5 h-5 text-[#ff3366]"></i>
        </div>
        <nav class="flex items-center gap-6">
            <a href="../index.html" class="text-sm font-bold uppercase tracking-wider text-gray-500 hover:text-[#ff3366] transition-colors">Home</a>
            <button onclick="toggleTheme()" class="text-gray-500 hover:text-black dark:text-gray-400 dark:hover:text-white transition-colors">
                <i id="themeIcon" data-lucide="moon" class="w-5 h-5"></i>
            </button>
        </nav>
    </header>

    <main class="flex-1 px-[8%] py-12 flex items-center justify-center">
        
        <div class="w-full max-w-xl p-8 rounded-3xl border border-gray-200 dark:border-[#2a2a2e] bg-white dark:bg-[#1c1c1f] shadow-xl shadow-[#ff3366]/5 transition-colors">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black mb-2">AI Hyperpop Generator</h1>
                <p class="text-gray-500 dark:text-gray-400 text-sm">Input a chaotic prompt or select an archetype to synthesize maximalist glitch patterns and pitch-shifted hooks.</p>
            </div>

            <div class="space-y-5">
                <div>
                    <label for="aiPrompt" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2 uppercase tracking-wide">Sonic Glitch Matrix Prompt</label>
                    <div class="relative">
                        <i data-lucide="activity" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                        <input type="text" id="aiPrompt" placeholder="e.g. 100gecs metallic crash, pitched-up nightcore rave melody..." 
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 dark:border-[#2a2a2e] bg-gray-50 dark:bg-[#0b0b0c] focus:outline-none focus:border-[#ff3366] dark:focus:border-[#ff3366] transition-colors text-gray-900 dark:text-white font-medium">
                    </div>
                </div>

                <div>
                    <label for="styleSelect" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2 uppercase tracking-wide">Glitch DNA Configuration</label>
                    <select id="styleSelect" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-[#2a2a2e] bg-gray-50 dark:bg-[#0b0b0c] focus:outline-none focus:border-[#ff3366] dark:focus:border-[#ff3366] transition-colors text-gray-900 dark:text-white cursor-pointer font-medium">
                        <option value="bubblegumbass">Bubblegum Bass / Metallic Pop</option>
                        <option value="cyberglitch">Cyber-Glitch / Chaotic Overdrive</option>
                        <option value="futurecore">Future Core / Chiptune Rave</option>
                    </select>
                </div>

                <button onclick="generateHyperpopTrack()" id="generateBtn" class="w-full mt-2 py-4 rounded-xl bg-[#ff3366]/10 text-[#ff3366] font-bold uppercase tracking-wider hover:bg-[#ff3366] hover:text-white transition-all duration-300 flex items-center justify-center gap-2 group">
                    <i data-lucide="binary" class="w-5 h-5 transition-transform group-hover:scale-110"></i>
                    <span id="btnText">Synthesize Glitch Matrix</span>
                </button>
            </div>

            <div id="playerConsole" class="mt-8 p-6 rounded-2xl bg-gray-50 dark:bg-[#0b0b0c] border border-gray-200 dark:border-[#2a2a2e] hidden transition-all">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <span id="metaGenre" class="text-xs font-bold uppercase tracking-widest text-[#ff3366]">CYBER-GLITCH ARCHETYPE</span>
                        <h3 id="metaSeed" class="text-lg font-black tracking-tight text-gray-900 dark:text-white">Glitch_Core_X.wav</h3>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-mono bg-gray-200 dark:bg-[#1c1c1f] px-2 py-1 rounded text-gray-500 dark:text-gray-400" id="bpmDisplay">165 BPM</span>
                    </div>
                </div>

                <div class="flex items-end justify-between gap-1 h-16 px-4 mb-6 bg-white dark:bg-[#1c1c1f] rounded-xl border border-gray-200 dark:border-[#2a2a2e] overflow-hidden">
                    <div class="v-bar w-full bg-gray-200 dark:bg-[#2a2a2e] h-2 rounded-t transition-all duration-100"></div>
                    <div class="v-bar w-full bg-[#ff3366]/50 h-8 rounded-t transition-all duration-100"></div>
                    <div class="v-bar w-full bg-[#ff3366] h-4 rounded-t transition-all duration-100"></div>
                    <div class="v-bar w-full bg-[#ff3366]/80 h-10 rounded-t transition-all duration-100"></div>
                    <div class="v-bar w-full bg-[#ff3366]/30 h-6 rounded-t transition-all duration-100"></div>
                    <div class="v-bar w-full bg-gray-200 dark:bg-[#2a2a2e] h-1 rounded-t transition-all duration-100"></div>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="togglePlayback()" id="playPauseBtn" class="flex-1 py-3 rounded-xl bg-gray-900 text-white dark:bg-white dark:text-black font-bold uppercase tracking-wide text-sm flex items-center justify-center gap-2 hover:opacity-90 transition-opacity">
                        <i data-lucide="play" class="w-4 h-4 fill-current"></i> Boot Audio Stream
                    </button>
                </div>
            </div>

        </div>
    </main>

    <script>
        // --- THEME LOGIC ---
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        });

        // --- WEB AUDIO API PROCEDURAL HYPERPOP ENGINE ---
        let audioCtx = null;
        let isPlaying = false;
        let currentStep = 0;
        let sequencerInterval = null;
        let bpm = 160;

        let scaleNotes = [];
        let patterns = { kick: [], snare: [], glitch: [], synth: [] };

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Custom Waveshaper Distortion Curve for aggressive digital clipping
        function getClippingCurve(amount = 80) {
            const k = amount;
            const samples = 44100;
            const curve = new Float32Array(samples);
            for (let i = 0; i < samples; ++i) {
                const x = (i * 2) / samples - 1;
                curve[i] = ((3 + k) * x) / (Math.PI + k * Math.abs(x));
            }
            return curve;
        }

        // Distorted Sub-Heavy Hyperpop Kick
        function playHeavyKick(time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const shaper = audioCtx.createWaveShaper();

            osc.frequency.setValueAtTime(180, time);
            osc.frequency.exponentialRampToValueAtTime(42, time + 0.12);

            shaper.curve = getClippingCurve(40);

            osc.connect(shaper);
            shaper.connect(gain);
            gain.connect(audioCtx.destination);

            gain.gain.setValueAtTime(1.2, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.14);

            osc.start(time);
            osc.stop(time + 0.15);
        }

        // Metallic High-Pitched Snare / Pop Clap
        function playMetallicSnare(time) {
            const bufferSize = audioCtx.sampleRate * 0.1;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = "bandpass";
            noiseFilter.frequency.value = 2200;

            const toneOsc = audioCtx.createOscillator();
            toneOsc.type = "triangle";
            toneOsc.frequency.setValueAtTime(440, time);
            toneOsc.frequency.exponentialRampToValueAtTime(180, time + 0.08);

            const gain = audioCtx.createGain();

            noise.connect(noiseFilter);
            noiseFilter.connect(gain);
            toneOsc.connect(gain);
            
            gain.connect(audioCtx.destination);

            gain.gain.setValueAtTime(0.6, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.12);

            noise.start(time);
            toneOsc.start(time);
            noise.stop(time + 0.13);
            toneOsc.stop(time + 0.13);
        }

        // High-Speed Chiptune Glitch/Hat Trigger
        function playGlitchBursts(time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = "square";
            // Fast erratic sliding frequencies mimicking digital buffer glitches
            osc.frequency.setValueAtTime(Math.random() * 4000 + 2000, time);
            osc.frequency.setValueAtTime(Math.random() * 1000 + 500, time + 0.02);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            gain.gain.setValueAtTime(0.15, time);
            gain.gain.setValueAtTime(0.001, time + 0.03);

            osc.start(time);
            osc.stop(time + 0.04);
        }

        // Bright, Laser-Like Arpeggiated Lead Synth
        function playLaserSynth(time, freq) {
            if (freq === 0) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = "square";
            osc.frequency.setValueAtTime(freq, time);
            // Hyper-fast vibrato effect
            osc.frequency.linearRampToValueAtTime(freq * 1.05, time + 0.03);
            osc.frequency.linearRampToValueAtTime(freq * 0.95, time + 0.06);

            filter.type = "peaking";
            filter.frequency.setValueAtTime(2000, time);
            filter.Q.value = 10;

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            gain.gain.setValueAtTime(0.18, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);

            osc.start(time);
            osc.stop(time + 0.16);
        }

        // AI Grid Architecture Engine Compiler
        function generateHyperpopTrack() {
            initAudio();
            stopBeat();

            const archetype = document.getElementById('styleSelect').value;
            const prompt = document.getElementById('aiPrompt').value;
            const btnText = document.getElementById('btnText');
            const generateBtn = document.getElementById('generateBtn');

            generateBtn.disabled = true;
            btnText.innerText = "Overclocking Synthesis Matrices...";

            setTimeout(() => {
                // Procedural Style Profiles
                if (archetype === 'bubblegumbass') {
                    bpm = 150;
                    scaleNotes = [523.25, 659.25, 783.99, 987.77, 1046.50]; // Sweet C Major 7 (High Octaves C5 - C6)
                } else if (archetype === 'cyberglitch') {
                    bpm = 175;
                    scaleNotes = [466.16, 493.88, 622.25, 698.46, 932.33]; // Aggressive Locrian / Tritone-heavy bands
                } else if (archetype === 'futurecore') {
                    bpm = 162;
                    scaleNotes = [587.33, 698.46, 880.00, 1174.66, 1396.91]; // Fast Chiptune D Minor scales
                }

                // Map out randomized, rapid 16-step grid configurations
                for (let i = 0; i < 16; i++) {
                    patterns.kick[i] = (i === 0 || i === 6 || i === 8 || i === 14 || (archetype === 'cyberglitch' && Math.random() > 0.7)) ? 1 : 0;
                    patterns.snare[i] = (i === 4 || i === 12 || (archetype === 'futurecore' && i === 15)) ? 1 : 0;
                    
                    // Erratic rapid fire glitching elements
                    patterns.glitch[i] = (i % 2 !== 0 || Math.random() > 0.5) ? 1 : 0;

                    // Hyperpop ultra-dense melody sequence builder
                    patterns.synth[i] = (i % 2 === 0 || Math.random() > 0.3) 
                        ? scaleNotes[Math.floor(Math.random() * scaleNotes.length)] 
                        : 0;
                }

                // UI Layout Transformations
                document.getElementById('metaGenre').innerText = `${archetype.toUpperCase()} MATRIX`;
                document.getElementById('metaSeed').innerText = prompt ? `"${prompt.substring(0, 24)}..."` : `Glitch_Core_${Math.floor(Math.random() * 8999 + 1000)}.wav`;
                document.getElementById('bpmDisplay').innerText = `${bpm} BPM`;

                generateBtn.disabled = false;
                btnText.innerText = "Synthesize Glitch Matrix";
                document.getElementById('playerConsole').classList.remove('hidden');

                startBeat();
            }, 1200);
        }

        // Loop Sequencer Clock Matrix Loop
        function stepSequencer() {
            const stepDuration = 60 / bpm / 4; 
            const time = audioCtx.currentTime;

            if (patterns.kick[currentStep]) playHeavyKick(time);
            if (patterns.snare[currentStep]) playMetallicSnare(time);
            if (patterns.glitch[currentStep]) playGlitchBursts(time);
            if (patterns.synth[currentStep]) {
                // Occasional pitch modulation multiplication to emulate glitch macro-bends
                const macroGlitchModifier = (Math.random() > 0.85) ? 1.5 : 1.0;
                playLaserSynth(time, patterns.synth[currentStep] * macroGlitchModifier);
            }

            // High-velocity Interface UI Visualizer Animations
            const bars = document.querySelectorAll('.v-bar');
            bars.forEach(bar => {
                const bounceHeight = Math.random() * 56 + 4; // Ultra dramatic bounces for hyperpop dynamics
                bar.style.height = `${bounceHeight}px`;
            });

            currentStep = (currentStep + 1) % 16;
        }

        function startBeat() {
            if (isPlaying) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            isPlaying = true;
            currentStep = 0;
            
            const intervalMs = (60 / bpm / 4) * 1000;
            sequencerInterval = setInterval(stepSequencer, intervalMs);

            document.getElementById('playPauseBtn').innerHTML = `<i data-lucide="square" class="w-4 h-4 fill-current"></i> Purge Matrix`;
            lucide.createIcons();
        }

        function stopBeat() {
            isPlaying = false;
            clearInterval(sequencerInterval);
            const bars = document.querySelectorAll('.v-bar');
            bars.forEach(bar => bar.style.height = `4px`);
            document.getElementById('playPauseBtn').innerHTML = `<i data-lucide="play" class="w-4 h-4 fill-current"></i> Boot Audio Stream`;
            lucide.createIcons();
        }

        function togglePlayback() {
            if (isPlaying) stopBeat();
            else startBeat();
        }
    </script>
</body>
</html>
