<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Key Generator</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- Responsive Container -->
    <div class="w-full max-w-sm bg-white rounded-xl shadow-md p-6 text-center box-border">
        <h2 class="font-bold text-2xl text-gray-800 mb-2">Secure Key Generator</h2>
        
        <!-- 'break-all' prevents the key from overflowing the container on narrow screens -->
        <h1 id="pwdDisplay" class="font-mono text-2xl my-6 tracking-widest text-[#ff3366] break-all min-h-[40px] flex items-center justify-center">
            ---
        </h1>
        
        <button onclick="generateKey()" class="w-full max-w-[200px] bg-[#ff3366] hover:bg-[#e02855] text-white font-semibold px-4 py-3 rounded-lg shadow-sm transition-colors cursor-pointer">
            Generate Key
        </button>
    </div>

    <script>
        function generateKey() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
            let password = "";
            for (let i = 0; i < 16; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('pwdDisplay').innerText = password;
        }
    </script>

</body>
</html>
