<div class="p-5 text-center">
    <h2 class="font-bold text-xl">Secure Key Generator</h2>
    <h1 id="pwdDisplay" class="font-mono text-2xl my-4 tracking-widest text-[#ff3366]">---</h1>
    <button onclick="generateKey()" class="bg-[#ff3366] text-white px-4 py-2">Generate Key</button>
</div>

<script>
    function generateKey() {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
        let password = "";
        for (let i = 0; i < 16; i++) {
            password += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        document.getElementById('pwdDisplay').innerText = password;
    }
</script>
