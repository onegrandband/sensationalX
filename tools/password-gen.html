<div class="p-8 rounded-2xl border border-gray-200 dark:border-[#2a2a2e] bg-white dark:bg-[#1c1c1f] shadow-xl shadow-[#ff3366]/5 max-w-md mx-auto text-center">
    <div class="w-12 h-12 bg-[#ff3366]/10 text-[#ff3366] rounded-xl flex items-center justify-center mb-4 mx-auto">
        <i data-lucide="key" class="w-6 h-6"></i>
    </div>
    
    <h3 class="text-xl font-bold mb-1 text-gray-900 dark:text-white">Secure Key Generator</h3>
    <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Create strong, cryptographically secure passwords and API keys.</p>
    
    <div class="relative flex items-center justify-center bg-gray-50 dark:bg-[#0b0b0c] border border-gray-200 dark:border-[#2a2a2e] rounded-xl p-4 mb-6 group min-h-[64px]">
        <h1 id="pwdDisplay" class="font-mono text-xl tracking-wider text-gray-400 dark:text-gray-500 break-all select-all">
            Click Generate...
        </h1>
        <button id="copyBtn" onclick="copyKey()" class="absolute right-3 hidden text-xs font-bold text-[#ff3366] hover:text-[#e62e5c] bg-white dark:bg-[#1c1c1f] px-2 py-1 rounded-md border border-gray-200 dark:border-[#2a2a2e] transition-colors">
            Copy
        </button>
    </div>
    
    <button onclick="generateKey()" class="w-full py-3 bg-[#ff3366] hover:bg-[#e62e5c] text-white font-bold rounded-xl transition-colors flex justify-center items-center gap-2">
        Generate Key
    </button>
</div>

<script>
    function generateKey() {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()-_=+[]{}|;:,.<>?";
        let password = "";
        
        // Using crypto.getRandomValues for true cryptographic security
        const array = new Uint32Array(16);
        window.crypto.getRandomValues(array);
        
        for (let i = 0; i < 16; i++) {
            password += chars.charAt(array[i] % chars.length);
        }
        
        const display = document.getElementById('pwdDisplay');
        const copyBtn = document.getElementById('copyBtn');
        
        // Update display and typography styling
        display.innerText = password;
        display.classList.remove('text-gray-400', 'dark:text-gray-500');
        display.classList.add('text-[#ff3366]', 'font-bold');
        
        // Show copy button
        copyBtn.classList.remove('hidden');
    }

    function copyKey() {
        const passwordText = document.getElementById('pwdDisplay').innerText;
        if (passwordText === "Click Generate...") return;
        
        navigator.clipboard.writeText(passwordText).then(() => {
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.innerText = "Copied!";
            setTimeout(() => {
                copyBtn.innerText = "Copy";
            }, 1500);
        });
    }
</script>
