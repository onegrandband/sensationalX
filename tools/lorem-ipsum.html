<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensationalX Lorem Ipsum Generator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = { darkMode: 'class' }
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>

<body class="bg-gray-50 dark:bg-[#0b0b0c] text-gray-900 dark:text-white font-sans antialiased transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="flex items-center justify-between border-b border-gray-200 dark:border-[#2a2a2e] bg-white dark:bg-[#1c1c1f] px-[8%] py-4 sticky top-0 z-40 transition-colors">
        <div class="text-xl font-extrabold tracking-widest uppercase flex items-center gap-2">
            <span class="text-[#ff3366]">SX</span> LOREM
            <i data-lucide="sparkles" class="w-5 h-5 text-[#ff3366]"></i>
        </div>
        <nav class="flex items-center gap-6">
            <a href="../index.html" class="text-sm font-bold uppercase tracking-wider text-gray-500 hover:text-[#ff3366] transition-colors">Home</a>
            <a href="../tools" class="text-sm font-bold uppercase tracking-wider text-gray-500 hover:text-[#ff3366] transition-colors">Tools</a>
            <button onclick="toggleTheme()" class="text-gray-500 hover:text-black dark:text-gray-400 dark:hover:text-white transition-colors cursor-pointer">
                <i id="themeIcon" data-lucide="moon" class="w-5 h-5"></i>
            </button>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center p-5">
        <div class="w-full max-w-lg bg-white dark:bg-[#1c1c1f] p-8 rounded-2xl border border-gray-200 dark:border-[#2a2a2e] shadow-xl text-center">
            
            <h2 class="font-bold text-2xl mb-6">Lorem Ipsum Generator</h2>
            
            <div class="flex items-center justify-center gap-4 mb-6">
                <input type="number" id="paragraphs" value="1" min="1" max="10" class="border border-gray-300 dark:border-[#2a2a2e] bg-gray-50 dark:bg-[#0b0b0c] p-2 rounded-lg w-20 text-center focus:outline-none focus:border-[#ff3366] transition-colors" />
                <button onclick="generateLorem()" class="bg-[#ff3366] hover:bg-[#e62e5c] transition-colors text-white font-semibold px-6 py-2 rounded-lg shadow-md cursor-pointer">
                    Generate
                </button>
            </div>

            <div id="loremOutput" class="mt-4 text-left text-sm max-w-md mx-auto text-gray-600 dark:text-gray-400 space-y-4 max-h-64 overflow-y-auto pr-2"></div>
            
        </div>
    </main>

    <!-- Scripts -->
    <script>
        // Theme Toggle Logic
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        });

        // Generator Logic
        function generateLorem() {
            const text = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. ";
            let count = document.getElementById('paragraphs').value;
            const outputContainer = document.getElementById('loremOutput');
            
            // Clear previous output
            outputContainer.innerHTML = '';
            
            // Generate paragraphs cleanly using standard <p> tags
            for (let i = 0; i < count; i++) {
                const p = document.createElement('p');
                p.textContent = text.repeat(2); // Repeat text twice per paragraph to make it look full
                outputContainer.appendChild(p);
            }
        }
    </script>

</body>
</html>
