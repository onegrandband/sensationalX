<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensationalX AI K-Pop Generator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = { darkMode: 'class' }
        // Theme init
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-[#0b0b0c] text-gray-900 dark:text-white font-sans antialiased transition-colors duration-300 min-h-screen flex flex-col">

    <header class="flex items-center justify-between border-b border-gray-200 dark:border-[#2a2a2e] bg-white dark:bg-[#1c1c1f] px-[8%] py-4 sticky top-0 z-40 transition-colors">
        <div class="text-xl font-extrabold tracking-widest uppercase flex items-center gap-2">
            <span class="text-[#ff3366]">SX</span> K-Pop Studio
            <i data-lucide="music-4" class="w-5 h-5 text-[#ff3366]"></i>
        </div>
        <nav class="flex items-center gap-6">
            <a href="../index.html" class="text-sm font-bold uppercase tracking-wider text-gray-500 hover:text-[#ff3366] transition-colors">Home</a>
            <button onclick="toggleTheme()" class="text-gray-500 hover:text-black dark:text-gray-400 dark:hover:text-white transition-colors">
                <i id="themeIcon" data-lucide="moon" class="w-5 h-5"></i>
            </button>
        </nav>
    </header>

    <main class="flex-1 px-[8%] py-12 flex items-center justify-center">
        
        <div class="w-full max-w-xl p-8 rounded-3xl border border-gray-200 dark:border-[#2a2a2e] bg-white dark:bg-[#1c1c1f] shadow-xl shadow-[#ff3366]/5 transition-colors">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black mb-2">AI K-Pop Generator</h1>
                <p class="text-gray-500 dark:text-gray-400 text-sm">Designate a group concept or prompt to engineer custom synth-pop melodies and signature dance beats.</p>
            </div>

            <div class="space-y-5">
                <div>
                    <label for="aiPrompt" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2 uppercase tracking-wide">Concept / Lyric Theme Prompt</label>
                    <div class="relative">
                        <i data-lucide="sparkles" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                        <input type="text" id="aiPrompt" placeholder="e.g. futuristic neon concept, bright pastel summer comeback..." 
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 dark:border-[#2a2a2e] bg-gray-50 dark:bg-[#0b0b0c] focus:outline-none focus:border-[#ff3366] dark:focus:border-[#ff3366] transition-colors text-gray-900 dark:text-white font-medium">
                    </div>
                </div>

                <div>
                    <label for="conceptSelect" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2 uppercase tracking-wide">Group Identity Concept</label>
                    <select id="conceptSelect" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-[#2a2a2e] bg-gray-50 dark:bg-[#0b0b0c] focus:outline-none focus:border-[#ff3366] dark:focus:border-[#ff3366] transition-colors text-gray-900 dark:text-white cursor-pointer font-medium">
                        <option value="bubblegum">Bubblegum Pop / High-Energy Bright</option>
                        <option value="girlcrush">Girl Crush / Heavy Synth Trap</option>
                        <option value="futurebass">Futuristic / Melodic EDM</option>
                        <option value="retro">90s Retro Disco Pop</option>
                    </select>
                </div>

                <button onclick="generateKpopTrack()" id="generateBtn" class="w-full mt-2 py-4 rounded-xl bg-[#ff3366]/10 text-[#ff3366] font-bold uppercase tracking-wider hover:bg-[#ff3366] hover:text-white transition-all duration-300 flex items-center justify-center gap-2 group">
                    <i data-lucide="disc-3" class="w-5 h-5 transition-transform group-hover:rotate-180 duration-500"></i>
                    <span id="btnText">Produce Comeback Single</span>
                </button>
            </div>

            <div id="playerConsole" class="mt-8 p-6 rounded-2xl bg-gray-50 dark:bg-[#0b0b0c] border border-gray-200 dark:border-[#2a2a2e] hidden transition-all">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <span id="metaGenre" class="text-xs font-bold uppercase tracking-widest text-[#ff3366]">BUBBLEGUM SIGNATURE</span>
                        <h3 id="metaSeed" class="text-lg font-black tracking-tight text-gray-900 dark:text-white">Single_Concept_901.wav</h3>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-mono bg-gray-200 dark:bg-[#1c1c1f] px-2 py-1 rounded text-gray-500 dark:text-gray-400" id="bpmDisplay">128 BPM</span>
                    </div>
                </div>

                <div class="flex items-end justify-between gap-1 h-14 px-4 mb-6 bg-white dark:bg-[#1c1c1f] rounded-xl border border-gray-200 dark:border-[#2a2a2e] overflow-hidden">
                    <div class="v-bar w-full bg-gray-200 dark:bg-[#2a2a2e] h-2 rounded-t transition-all duration-100"></div>
                    <div class="v-bar w-full bg-[#ff3366]/40 h-6 rounded-t transition-all duration-100"></div>
                    <div class="v-bar w-full bg-[#ff3366] h-2 rounded-t transition-all duration-100"></div>
                    <div class="v-bar w-full bg-[#ff3366]/70 h-5 rounded-t transition-all duration-100"></div>
                    <div class="v-bar w-full bg-gray-200 dark:bg-[#2a2a2e] h-1 rounded-t transition-all duration-100"></div>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="togglePlayback()" id="playPauseBtn" class="flex-1 py-3 rounded-xl bg-gray-900 text-white dark:bg-white dark:text-black font-bold uppercase tracking-wide text-sm flex items-center justify-center gap-2 hover:opacity-90 transition-opacity">
                        <i data-lucide="play" class="w-4 h-4 fill-current"></i> Stream Demotrack
                    </button>
                </div>
            </div>

        </div>
    </main>

    <script>
        // --- THEME LOGIC ---
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        });

        // --- WEB AUDIO API PROCEDURAL K-POP ENGINE ---
        let audioCtx = null;
        let isPlaying = false;
        let currentStep = 0;
        let sequencerInterval = null;
        let bpm = 125;

        // Custom Pitch Banks mapping bright scales
        let melodicScale = [];
        let patterns = { kick: [], clap: [], hat: [], synth: [] };

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Deep Electronic Pop Kick Drum 
        function playKick(time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.frequency.setValueAtTime(160, time);
            osc.frequency.exponentialRampToValueAtTime(45, time + 0.1);

            gain.gain.setValueAtTime(1.1, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);

            osc.start(time);
            osc.stop(time + 0.13);
        }

        // Snappy Studio Dance Clap
        function playClap(time) {
            const bufferSize = audioCtx.sampleRate * 0.12;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = "bandpass";
            filter.frequency.value = 1400;

            const gain = audioCtx.createGain();
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            gain.gain.setValueAtTime(0.5, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);

            noise.start(time);
            noise.stop(time + 0.12);
        }

        // Electronic Dance Closed Hat
        function playHat(time, amplitude = 0.22) {
            const bufferSize = audioCtx.sampleRate * 0.04;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = "highpass";
            filter.frequency.value = 8500;

            const gain = audioCtx.createGain();
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            gain.gain.setValueAtTime(amplitude, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.03);

            noise.start(time);
            noise.stop(time + 0.04);
        }

        // Bright K-Pop Chord Synth Stabs
        function playPopSynth(time, freq) {
            if (freq === 0) return;

            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc1.type = "triangle";
            osc1.frequency.setValueAtTime(freq, time);

            osc2.type = "sine";
            osc2.frequency.setValueAtTime(freq * 2, time); // Bright octave generator

            filter.type = "lowpass";
            filter.frequency.setValueAtTime(1500, time);
            filter.frequency.exponentialRampToValueAtTime(3200, time + 0.08);

            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            gain.gain.setValueAtTime(0.28, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.18);

            osc1.start(time);
            osc2.start(time);
            osc1.stop(time + 0.2);
            osc2.stop(time + 0.2);
        }

        // AI Procedural Matrix Configuration Engine
        function generateKpopTrack() {
            initAudio();
            stopBeat();

            const concept = document.getElementById('conceptSelect').value;
            const prompt = document.getElementById('aiPrompt').value;
            const btnText = document.getElementById('btnText');
            const generateBtn = document.getElementById('generateBtn');

            generateBtn.disabled = true;
            btnText.innerText = "Syncing Digital Choreography...";

            setTimeout(() => {
                // Procedural Style Profiles
                if (concept === 'bubblegum') {
                    bpm = 132;
                    melodicScale = [523.25, 587.33, 659.25, 783.99, 880.00]; // Bright C Major Pentatonic (C5 - A5)
                } else if (concept === 'girlcrush') {
                    bpm = 140;
                    melodicScale = [466.16, 523.25, 554.37, 622.25, 698.46]; // A# Minor Scales for edgy brass tones
                } else if (concept === 'futurebass') {
                    bpm = 126;
                    melodicScale = [587.33, 659.25, 739.99, 880.00, 987.77]; // D Major Sparkly Scales
                } else if (concept === 'retro') {
                    bpm = 118;
                    melodicScale = [440.00, 493.88, 523.25, 587.33, 659.25]; // Smooth A Minor Disco scale
                }

                // Map out custom 16-step grid configurations
                for (let i = 0; i < 16; i++) {
                    patterns.kick[i] = (i === 0 || i === 8 || (concept === 'retro' && i % 4 === 0) || (concept === 'girlcrush' && i === 6)) ? 1 : 0;
                    patterns.clap[i] = (i === 4 || i === 12) ? 1 : 0;
                    
                    // Multi-tempo hi-hat engine
                    if (concept === 'girlcrush') {
                        patterns.hat[i] = (i % 2 === 0 || Math.random() > 0.4) ? 1 : 0; // Rapid trap hats
                    } else {
                        patterns.hat[i] = (i % 2 !== 0) ? 1 : 0; // Continuous upbeat dance EDM hats
                    }

                    // Bright melody array builder
                    patterns.synth[i] = (i % 3 === 0 || (concept === 'futurebass' && i % 2 === 0) || Math.random() > 0.7) 
                        ? melodicScale[Math.floor(Math.random() * melodicScale.length)] 
                        : 0;
                }

                // Render UI changes
                document.getElementById('metaGenre').innerText = `${concept.toUpperCase()} CONCEPT`;
                document.getElementById('metaSeed').innerText = prompt ? `"${prompt.substring(0, 24)}..."` : `KPop_Seed_${Math.floor(Math.random() * 8000 + 1000)}.wav`;
                document.getElementById('bpmDisplay').innerText = `${bpm} BPM`;

                generateBtn.disabled = false;
                btnText.innerText = "Produce Comeback Single";
                document.getElementById('playerConsole').classList.remove('hidden');

                startBeat();
            }, 1100);
        }

        // Loop Sequencer Core
        function stepSequencer() {
            const stepDuration = 60 / bpm / 4; 
            const time = audioCtx.currentTime;

            if (patterns.kick[currentStep]) playKick(time);
            if (patterns.clap[currentStep]) playClap(time);
            if (patterns.hat[currentStep]) {
                const isTrapRoll = (document.getElementById('conceptSelect').value === 'girlcrush' && currentStep % 3 === 0);
                playHat(time, isTrapRoll ? 0.35 : 0.18);
            }
            if (patterns.synth[currentStep]) playPopSynth(time, patterns.synth[currentStep]);

            // CSS Interface Animation Drivers
            const bars = document.querySelectorAll('.v-bar');
            bars.forEach(bar => {
                const calculatedFlex = Math.random() * 48 + 4;
                bar.style.height = `${calculatedFlex}px`;
            });

            currentStep = (currentStep + 1) % 16;
        }

        function startBeat() {
            if (isPlaying) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            isPlaying = true;
            currentStep = 0;
            
            const intervalMs = (60 / bpm / 4) * 1000;
            sequencerInterval = setInterval(stepSequencer, intervalMs);

            document.getElementById('playPauseBtn').innerHTML = `<i data-lucide="square" class="w-4 h-4 fill-current"></i> Pause Stream`;
            lucide.createIcons();
        }

        function stopBeat() {
            isPlaying = false;
            clearInterval(sequencerInterval);
            const bars = document.querySelectorAll('.v-bar');
            bars.forEach(bar => bar.style.height = `4px`);
            document.getElementById('playPauseBtn').innerHTML = `<i data-lucide="play" class="w-4 h-4 fill-current"></i> Stream Demotrack`;
            lucide.createIcons();
        }

        function togglePlayback() {
            if (isPlaying) stopBeat();
            else startBeat();
        }
    </script>
</body>
</html>
