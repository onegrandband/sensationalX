<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensationalX Video Recorder</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = { darkMode: 'class' }
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>

<body class="bg-gray-50 dark:bg-[#0b0b0c] text-gray-900 dark:text-white font-sans antialiased transition-colors duration-300 min-h-screen flex flex-col">

    <header class="flex items-center justify-between border-b border-gray-200 dark:border-[#2a2a2e] bg-white dark:bg-[#1c1c1f] px-[8%] py-4 sticky top-0 z-40 transition-colors">
        <div class="text-xl font-extrabold tracking-widest uppercase flex items-center gap-2">
            <span class="text-[#ff3366]">SX</span> VIDEOS
            <i data-lucide="sparkles" class="w-5 h-5 text-[#ff3366]"></i>
        </div>
        <nav class="flex items-center gap-6">
            <a href="../index.html" class="text-sm font-bold uppercase tracking-wider text-gray-500 hover:text-[#ff3366] transition-colors">Home</a>
            <a href="../tools" class="text-sm font-bold uppercase tracking-wider text-gray-500 hover:text-[#ff3366] transition-colors">Tools</a>
            <button onclick="toggleTheme()" class="text-gray-500 hover:text-black dark:text-gray-400 dark:hover:text-white transition-colors">
                <i id="themeIcon" data-lucide="moon" class="w-5 h-5"></i>
            </button>
        </nav>
    </header>

    <!-- MAIN RECORDER INTERFACE -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8 flex flex-col gap-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Live Camera Feed -->
            <div class="bg-white dark:bg-[#1c1c1f] border border-gray-200 dark:border-[#2a2a2e] rounded-2xl p-4 flex flex-col gap-4 shadow-sm">
                <h2 class="text-sm font-bold uppercase tracking-wider text-gray-400">Live Preview</h2>
                <div class="relative aspect-video bg-black rounded-xl overflow-hidden flex items-center justify-center">
                    <video id="videoPreview" autoplay playsinline class="w-full h-full object-cover"></video>
                </div>
            </div>

            <!-- Recorded Video Playback -->
            <div class="bg-white dark:bg-[#1c1c1f] border border-gray-200 dark:border-[#2a2a2e] rounded-2xl p-4 flex flex-col gap-4 shadow-sm">
                <h2 class="text-sm font-bold uppercase tracking-wider text-gray-400">Playback</h2>
                <div class="relative aspect-video bg-black rounded-xl overflow-hidden flex items-center justify-center">
                    <video id="recordedPlayback" class="w-full h-full object-cover"></video>
                </div>
            </div>

        </div>

        <!-- Control Action Bar -->
        <div class="flex flex-wrap items-center justify-center gap-4 bg-white dark:bg-[#1c1c1f] border border-gray-200 dark:border-[#2a2a2e] rounded-2xl p-6 shadow-sm">
            <button id="startRecordBtn" class="flex items-center gap-2 px-6 py-3 bg-[#ff3366] hover:bg-[#e02b5a] text-white font-bold rounded-xl transition-all shadow-lg shadow-[#ff3366]/20 disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="play" class="w-4 h-4"></i> Start Recording
            </button>
            <button id="stopRecordBtn" disabled class="flex items-center gap-2 px-6 py-3 bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="square" class="w-4 h-4"></i> Stop
            </button>
            <button id="downloadBtn" disabled class="flex items-center gap-2 px-6 py-3 bg-gray-200 dark:bg-gray-800 hover:bg-emerald-600 hover:text-white text-gray-700 dark:text-gray-300 font-bold rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="download" class="w-4 h-4"></i> Download Video
            </button>
        </div>
    </main>

    <script>
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        });
    </script>
    <script src="recorder.js"></script>
</body>
</html>
