<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hex RGB Converter</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#0b1020; color:#eef2ff; display:grid; place-items:center; min-height:100vh; }
    .wrap { width:min(680px,90vw); background:#111827; border:1px solid #243046; border-radius:20px; padding:24px; }
    h1 { margin-top:0; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
    label { display:block; margin-bottom:8px; color:#b7c2d9; }
    input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid #2d3a52; background:#0d1323; color:white; }
    .swatch { width:100%; height:72px; border-radius:14px; border:1px solid rgba(255,255,255,.1); margin-top:18px; background:#ff3366; }
    .result { margin-top:18px; color:#9ae6b4; font-weight:bold; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Hex RGB Converter</h1>
    <div class="grid">
      <div>
        <label for="hex">Hex color</label>
        <input id="hex" value="#ff3366" maxlength="7" />
      </div>
      <div>
        <label for="r">Red</label>
        <input id="r" type="number" min="0" max="255" value="255" />
      </div>
      <div>
        <label for="g">Green</label>
        <input id="g" type="number" min="0" max="255" value="51" />
      </div>
      <div>
        <label for="b">Blue</label>
        <input id="b" type="number" min="0" max="255" value="102" />
      </div>
    </div>
    <div class="swatch" id="swatch"></div>
    <div class="result" id="result">rgb(255, 51, 102)</div>
  </div>

  <script>
    const hexInput = document.getElementById('hex');
    const rInput = document.getElementById('r');
    const gInput = document.getElementById('g');
    const bInput = document.getElementById('b');

    function clamp255(v) { return Math.max(0, Math.min(255, Number(v) || 0)); }
    function toHex(value) { return value.toString(16).padStart(2, '0'); }

    function updateFromHex() {
      const hex = hexInput.value.trim();
      const match = /^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.exec(hex);
      if (!match) return;
      let raw = match[1];
      if (raw.length === 3) raw = raw.split('').map(ch => ch + ch).join('');
      const value = parseInt(raw, 16);
      const r = (value >> 16) & 255;
      const g = (value >> 8) & 255;
      const b = value & 255;
      rInput.value = r;
      gInput.value = g;
      bInput.value = b;
      paint();
    }

    function updateFromRgb() {
      const r = clamp255(rInput.value);
      const g = clamp255(gInput.value);
      const b = clamp255(bInput.value);
      const hex = '#' + toHex(r) + toHex(g) + toHex(b);
      hexInput.value = hex;
      paint();
    }

    function paint() {
      const r = clamp255(rInput.value);
      const g = clamp255(gInput.value);
      const b = clamp255(bInput.value);
      const rgb = `rgb(${r}, ${g}, ${b})`;
      document.getElementById('swatch').style.background = rgb;
      document.getElementById('result').textContent = rgb;
    }

    hexInput.addEventListener('input', updateFromHex);
    rInput.addEventListener('input', updateFromRgb);
    gInput.addEventListener('input', updateFromRgb);
    bInput.addEventListener('input', updateFromRgb);
    paint();
  </script>
</body>
</html>
