<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentality</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Styles the buttons to fit everything perfectly */
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;              /* Space between image and text */
            padding: 8px 16px;     /* Normal button padding */
            font-size: 16px;       /* Normal text size */
            cursor: pointer;
        }

        /* Forces the images to fit inside the standard button size */
        button img {
            width: 20px;           /* Scales the width down */
            height: 20px;          /* Scales the height down */
            object-fit: contain;   /* Prevents the image from distorting */
        }
    </style>
</head>
<body>
    <h2>Download Mentality</h2>
    <p>Download the latest model of Mentality!</p>
    
    <button id="downloadWin">
        <img src="/tools/apps/img/windows.png" alt="Windows logo"> Windows
    </button>
    <button id="downloadMac">
        <img src="/tools/apps/img/mac.png" alt="MacOS logo"> MacOS
    </button>
    <button id="downloadLinux">
        <img src="/tools/apps/img/linux.png" alt="Linux logo"> Linux
    </button>

    <script>
        document.getElementById('downloadWin').addEventListener('click', () => {
            const link = document.createElement('a');
            link.href = '/tools/apps/programs/Mentality.exe';
            link.download = 'Mentality.exe';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            console.log("Downloading latest version... While you wait, here's a fun fact! Did you know that ACM can stand for Automated Clicker Machinery? :)");
        });

        document.getElementById('downloadMac').addEventListener('click', () => {
            const link = document.createElement('a');
            link.href = '/tools/apps/programs/Mentality.dmg';
            link.download = 'Mentality.dmg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            console.log("Downloading latest version on Mac... While you wait, here's a fun fact! Did you know that ACM can stand for Automated Clicker Machinery? :)");
        });

        document.getElementById('downloadLinux').addEventListener('click', () => {
            const link = document.createElement('a');
            // Note: Your original snippet cut off here, make sure your Linux click event closes properly!
            link.href = '/tools/apps/programs/Mentality.tar.gz';
            link.download = 'Mentality.tar.gz';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
