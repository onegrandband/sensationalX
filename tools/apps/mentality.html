<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentality</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Styles the buttons to fit everything perfectly */
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px; /* Space between image and text */
            padding: 8px 16px; /* Normal button padding */
            font-size: 16px; /* Normal text size */
            cursor: pointer;
        }
        /* Forces the images to fit inside the standard button size */
        button img {
            width: 20px; /* Scales the width down */
            height: 20px; /* Scales the height down */
            object-fit: contain; /* Prevents the image from distorting */
        }
        /* Style for the version selection area */
        .version-selector {
            margin-bottom: 20px;
        }
        select {
            padding: 6px 12px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Download Mentality</h2>
    <p>Download the latest model of Mentality!</p>

    <!-- Version Selection Dropdown -->
    <div class="version-selector">
        <label for="versionSelect"><strong>Choose Version: </strong></label>
        <select id="versionSelect">
            <option value="1.1.1" selected>1.1.1 (Latest)</option>
            <option value="1.1.0">1.1.0</option>
            <option value="1.0.0">1.0.0</option>
        </select>
    </div>

    <!-- Download Buttons -->
    <button id="downloadWin">
        <img src="/tools/apps/img/windows.png" alt="Windows logo"> Windows
    </button>
    <button id="downloadMac">
        <img src="/tools/apps/img/mac.png" alt="MacOS logo"> MacOS
    </button>
    <button id="downloadLinux">
        <img src="/tools/apps/img/linux.png" alt="Linux logo"> Linux
    </button>

    <script>
        // Helper function to handle downloads based on platform and file extension
        function downloadFile(platform, extension) {
            const versionSelect = document.getElementById('versionSelect');
            const selectedVersion = versionSelect.value;
            
            // Build paths like: /tools/apps/programs/1.1.1/Mentality.exe or just Mentality_1.1.1.exe
            // Adjust this path logic depending on how you organize your server files!
            const filePath = `/tools/apps/programs/${selectedVersion}/Mentality.${extension}`;
            const fileName = `Mentality_${selectedVersion}.${extension}`;

            const link = document.createElement('a');
            link.href = filePath;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // Log fun facts for specific platforms if it's the latest version
            if (selectedVersion === '1.1.1' && (platform === 'Windows' || platform === 'Mac')) {
                console.log(`Downloading latest version on ${platform}... While you wait, here's a fun fact! Did you know that ACM can stand for Automated Clicker Machinery? :)`);
            } else {
                console.log(`Downloading Mentality version ${selectedVersion} for ${platform}...`);
            }
        }

        // Event Listeners for buttons
        document.getElementById('downloadWin').addEventListener('click', () => {
            downloadFile('Windows', 'exe');
        });

        document.getElementById('downloadMac').addEventListener('click', () => {
            downloadFile('Mac', 'dmg');
        });

        document.getElementById('downloadLinux').addEventListener('click', () => {
            downloadFile('Linux', 'tar.gz');
        });
    </script>
</body>
</html>
