<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensationalX Easy Math Calc</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = { darkMode: 'class' }
        // Theme init
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-[#0b0b0c] text-gray-900 dark:text-white font-sans antialiased transition-colors duration-300 min-h-screen flex flex-col">

    <header class="flex items-center justify-between border-b border-gray-200 dark:border-[#2a2a2e] bg-white dark:bg-[#1c1c1f] px-[8%] py-4 sticky top-0 z-40 transition-colors">
        <div class="text-xl font-extrabold tracking-widest uppercase flex items-center gap-2">
            <span class="text-[#ff3366]">SX</span> Math
            <i data-lucide="plus-calculate" class="w-5 h-5 text-[#ff3366]"></i>
        </div>
        <nav class="flex items-center gap-6">
            <a href="../index.html" class="text-sm font-bold uppercase tracking-wider text-gray-500 hover:text-[#ff3366] transition-colors">Home</a>
            <button onclick="toggleTheme()" class="text-gray-500 hover:text-black dark:text-gray-400 dark:hover:text-white transition-colors">
                <i id="themeIcon" data-lucide="moon" class="w-5 h-5"></i>
            </button>
        </nav>
    </header>

    <main class="flex-1 px-[8%] py-12 flex items-center justify-center">
        
        <div class="w-full max-w-md p-8 rounded-3xl border border-gray-200 dark:border-[#2a2a2e] bg-white dark:bg-[#1c1c1f] shadow-xl shadow-[#ff3366]/5 transition-colors">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black mb-2">Easy Calculator</h1>
                <p class="text-gray-500 dark:text-gray-400 text-sm">Perform fast and basic arithmetic instantly.</p>
            </div>

            <div class="space-y-5">
                <div>
                    <label for="num1" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2 uppercase tracking-wide">First Number</label>
                    <input type="number" id="num1" placeholder="Enter first number" 
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-[#2a2a2e] bg-gray-50 dark:bg-[#0b0b0c] focus:outline-none focus:border-[#ff3366] dark:focus:border-[#ff3366] transition-colors text-gray-900 dark:text-white font-medium">
                </div>

                <div>
                    <label for="num2" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2 uppercase tracking-wide">Second Number</label>
                    <input type="number" id="num2" placeholder="Enter second number" 
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-[#2a2a2e] bg-gray-50 dark:bg-[#0b0b0c] focus:outline-none focus:border-[#ff3366] dark:focus:border-[#ff3366] transition-colors text-gray-900 dark:text-white font-medium">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2 uppercase tracking-wide">Operation</label>
                    <div class="grid grid-cols-4 gap-3">
                        <button onclick="calculate('+')" class="py-3 rounded-xl bg-gray-50 dark:bg-[#0b0b0c] border border-gray-200 dark:border-[#2a2a2e] font-extrabold text-xl hover:border-[#ff3366] dark:hover:border-[#ff3366] hover:text-[#ff3366] transition-all duration-200">+</button>
                        <button onclick="calculate('-')" class="py-3 rounded-xl bg-gray-50 dark:bg-[#0b0b0c] border border-gray-200 dark:border-[#2a2a2e] font-extrabold text-xl hover:border-[#ff3366] dark:hover:border-[#ff3366] hover:text-[#ff3366] transition-all duration-200">−</button>
                        <button onclick="calculate('*')" class="py-3 rounded-xl bg-gray-50 dark:bg-[#0b0b0c] border border-gray-200 dark:border-[#2a2a2e] font-extrabold text-xl hover:border-[#ff3366] dark:hover:border-[#ff3366] hover:text-[#ff3366] transition-all duration-200">×</button>
                        <button onclick="calculate('/')" class="py-3 rounded-xl bg-gray-50 dark:bg-[#0b0b0c] border border-gray-200 dark:border-[#2a2a2e] font-extrabold text-xl hover:border-[#ff3366] dark:hover:border-[#ff3366] hover:text-[#ff3366] transition-all duration-200">÷</button>
                    </div>
                </div>
            </div>

            <div id="resultBox" class="mt-8 p-6 rounded-2xl bg-gray-50 dark:bg-[#0b0b0c] border border-gray-200 dark:border-[#2a2a2e] text-center hidden transition-all">
                <p id="resultText" class="text-gray-500 dark:text-gray-400 text-sm font-medium mb-1">Answer</p>
                <div id="resultValue" class="text-4xl font-black text-[#ff3366]">---</div>
            </div>

        </div>
    </main>

    <script>
        // --- THEME LOGIC ---
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        }

        // Initialize icons on load
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        });

        // --- MATH CALCULATOR LOGIC ---
        function calculate(operator) {
            const num1 = parseFloat(document.getElementById('num1').value);
            const num2 = parseFloat(document.getElementById('num2').value);
            
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');
            const resultValue = document.getElementById('resultValue');

            resultBox.classList.remove('hidden');

            // Form validation
            if (isNaN(num1) || isNaN(num2)) {
                resultText.innerText = "Error";
                resultValue.innerText = "Enter valid numbers";
                resultValue.className = "text-xl font-bold text-red-500 mt-1";
                return;
            }

            let finalValue = 0;
            let displayOperator = operator;

            switch(operator) {
                case '+': finalValue = num1 + num2; break;
                case '-': finalValue = num1 - num2; displayOperator = '−'; break;
                case '*': finalValue = num1 * num2; displayOperator = '×'; break;
                case '/': 
                    if (num2 === 0) {
                        resultText.innerText = "Math Error";
                        resultValue.innerText = "Cannot divide by 0";
                        resultValue.className = "text-xl font-bold text-red-500 mt-1";
                        return;
                    }
                    finalValue = num1 / num2; 
                    displayOperator = '÷'; 
                    break;
            }

            // Clean floating point errors (max 6 decimals)
            const cleanResult = parseFloat(finalValue.toFixed(6));

            // Format Output
            resultValue.className = "text-4xl font-black text-[#ff3366]";
            resultText.innerText = `${num1} ${displayOperator} ${num2} =`;
            resultValue.innerText = cleanResult;
        }
    </script>
</body>
</html>
