<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensationalX | Size Estimator</title>
    
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-color: #f4f4f4;
            --text-color: #111111;
            --text-muted: #555555;
            --accent-color: #d90429;
            --button-text: #ffffff;
            --border-color: #dddddd;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #eeeeee;
            --text-muted: #aaaaaa;
            --accent-color: #ef233c;
            --button-text: #ffffff;
            --border-color: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            background-color: var(--surface-color);
            border-bottom: 2px solid var(--accent-color);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        main {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            width: 100%;
        }

        h2 { font-size: 2rem; color: var(--accent-color); margin-bottom: 1rem; }
        p { font-size: 1.1rem; margin-bottom: 1.5rem; color: var(--text-muted); }

        button {
            background-color: var(--accent-color);
            color: var(--button-text);
            border: none;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            text-transform: uppercase;
            border-radius: 4px;
        }

        button:hover { opacity: 0.8; }

        .theme-toggle {
            background-color: transparent;
            color: var(--text-color);
            border: 2px solid var(--text-color);
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        .tool-card {
            background-color: var(--surface-color);
            padding: 2.5rem;
            border-left: 4px solid var(--accent-color);
            border-radius: 0 4px 4px 0;
        }

        input, select {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
            border-radius: 4px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .size-display {
            font-size: 2.5rem;
            font-weight: bold;
            margin-top: 1.5rem;
            color: var(--text-color);
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SensationalX</div>
        <button class="theme-toggle" id="themeBtn" aria-label="Toggle theme">Dark Mode</button>
    </header>

    <main>
        <div class="tool-card">
            <h2>Audio Size Estimator</h2>
            <p>Calculate estimated file size based on track duration and bitrate format.</p>
            
            <div class="input-group">
                <input type="number" id="audioMins" placeholder="Total Minutes" min="0" step="0.1" value="3.5">
                <select id="audioBitrate">
                    <option value="320">MP3 - 320 kbps</option>
                    <option value="1411" selected>WAV - 1411 kbps (16-bit/44.1kHz CD Quality)</option>
                    <option value="2116">WAV - 2116 kbps (24-bit/44.1kHz)</option>
                    <option value="4608">WAV - 4608 kbps (24-bit/96kHz High-Res)</option>
                </select>
            </div>
            
            <button type="button" onclick="calculateSize()" style="width: 100%;">Calculate Size</button>
            <div class="size-display" id="sizeOutput">~37.04 MB</div>
        </div>
    </main>

    <script>
        // Dark Mode Logic
        const btn = document.getElementById('themeBtn');
        btn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                btn.textContent = 'Dark Mode';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                btn.textContent = 'Light Mode';
            }
        });

        // File Size Estimator Logic
        function calculateSize() {
            const mins = parseFloat(document.getElementById('audioMins').value) || 0;
            const kbps = parseFloat(document.getElementById('audioBitrate').value) || 0;
            
            // Formula: (Seconds * kbps) / 8 to get KB, then / 1024 for MB
            const sizeInMB = ((mins * 60) * kbps) / 8 / 1024;
            
            document.getElementById('sizeOutput').textContent = `~${sizeInMB.toFixed(2)} MB`;
        }
    </script>
</body>
</html>
