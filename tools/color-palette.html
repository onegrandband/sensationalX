<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensationalX Random Palette Generator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = { darkMode: 'class' }
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>

<body class="bg-gray-50 dark:bg-[#0b0b0c] text-gray-900 dark:text-white font-sans antialiased transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="flex items-center justify-between border-b border-gray-200 dark:border-[#2a2a2e] bg-white dark:bg-[#1c1c1f] px-[8%] py-4 sticky top-0 z-40 transition-colors">
        <div class="text-xl font-extrabold tracking-widest uppercase flex items-center gap-2">
            <span class="text-[#ff3366]">SX</span> PALETTE
            <i data-lucide="sparkles" class="w-5 h-5 text-[#ff3366]"></i>
        </div>
        <nav class="flex items-center gap-6">
            <a href="../index.html" class="text-sm font-bold uppercase tracking-wider text-gray-500 hover:text-[#ff3366] transition-colors">Home</a>
            <a href="../tools" class="text-sm font-bold uppercase tracking-wider text-gray-500 hover:text-[#ff3366] transition-colors">Tools</a>
            <button onclick="toggleTheme()" class="text-gray-500 hover:text-black dark:text-gray-400 dark:hover:text-white transition-colors cursor-pointer">
                <i id="themeIcon" data-lucide="moon" class="w-5 h-5"></i>
            </button>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center p-5">
        <div class="w-full max-w-xl bg-white dark:bg-[#1c1c1f] p-8 rounded-2xl border border-gray-200 dark:border-[#2a2a2e] shadow-xl text-center">
            
            <h2 class="font-bold text-2xl mb-2 text-gray-900 dark:text-white">Random Palette Generator</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Click any color to copy its hex code.</p>
            
            <!-- Palette Container -->
            <div id="paletteBox" class="flex justify-center h-32 my-6 gap-1 rounded-lg overflow-hidden shadow-inner w-full bg-gray-100 dark:bg-gray-800 p-1">
                <!-- Colors will be injected here -->
            </div>

            <button onclick="generatePalette()" class="bg-[#ff3366] hover:bg-[#e62e5c] transition-colors duration-200 text-white font-semibold px-8 py-3 rounded-lg shadow-md cursor-pointer mt-2">
                Generate Colors
            </button>
            
        </div>
    </main>

    <!-- Scripts -->
    <script>
        // Theme Toggle Logic
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
            
            // Generate initial palette on load
            generatePalette();
        });

        // Palette Generator Logic
        function generatePalette() {
            const box = document.getElementById('paletteBox');
            box.innerHTML = ''; 

            for (let i = 0; i < 5; i++) {
                // Generate random hex color safely using Web Crypto API
                const array = new Uint8Array(3);
                window.crypto.getRandomValues(array);
                const color = '#' + Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');

                // Create color element
                const colorDiv = document.createElement('div');
                // Using flex-1 to distribute width evenly, group for hover states, and relative/z-index for scaling over siblings
                colorDiv.className = 'flex-1 h-full flex flex-col items-center justify-center text-xs text-white font-mono cursor-pointer transition-all duration-200 hover:scale-[1.03] hover:z-10 hover:shadow-lg rounded-sm group relative';
                colorDiv.style.backgroundColor = color;
                
                colorDiv.innerHTML = `
                    <span class="bg-black/60 px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity absolute top-3 font-semibold pointer-events-none">Copy</span>
                    <span class="mt-auto mb-3 bg-black/40 px-2 py-1 rounded drop-shadow-sm pointer-events-none">${color}</span>
                `;

                // Click to copy to clipboard functionality
                colorDiv.addEventListener('click', () => {
                    navigator.clipboard.writeText(color);
                    const originalText = colorDiv.innerHTML;
                    
                    colorDiv.innerHTML = `
                        <span class="bg-white/90 text-black px-2 py-1 rounded absolute top-3 font-bold shadow-sm pointer-events-none">Copied!</span>
                        <span class="mt-auto mb-3 bg-black/40 px-2 py-1 rounded drop-shadow-sm pointer-events-none">${color}</span>
                    `;
                    
                    setTimeout(() => {
                        colorDiv.innerHTML = originalText;
                    }, 1000);
                });

                box.appendChild(colorDiv);
            }
        }
    </script>
</body>
</html>
