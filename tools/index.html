<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensationalX Tools Hub</title>
    
    <!-- Tailwind & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = { darkMode: 'class' }
        // Theme init
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-[#0b0b0c] text-gray-900 dark:text-white font-sans antialiased transition-colors duration-300 min-h-screen">

    <!-- Header -->
    <header class="flex items-center justify-between border-b border-gray-200 dark:border-[#2a2a2e] bg-white dark:bg-[#1c1c1f] px-[8%] py-4 sticky top-0 z-40">
        <div class="text-xl font-extrabold tracking-widest uppercase">
            <span class="text-[#ff3366]">SX</span> Tools
        </div>
        <nav class="flex items-center gap-6">
            <a href="../index.html" class="text-sm font-bold uppercase tracking-wider text-gray-500 hover:text-[#ff3366] transition-colors">Home</a>
            <button onclick="toggleTheme()" class="text-gray-500 hover:text-black dark:text-gray-400 dark:hover:text-white transition-colors">
                <i id="themeIcon" data-lucide="moon" class="w-5 h-5"></i>
            </button>
        </nav>
    </header>

    <main class="px-[8%] py-12 max-w-5xl mx-auto">
        <div class="mb-12">
            <h1 class="text-4xl font-black mb-3">Project Toolkit</h1>
            <p class="text-gray-500 dark:text-gray-400">Select a tool to get started.</p>
        </div>

        <!-- Tools Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Downloader -->
            <a href="../tools/downloader.html" class="group p-8 rounded-2xl border border-gray-200 dark:border-[#2a2a2e] bg-white dark:bg-[#1c1c1f] hover:border-[#ff3366] transition-all hover:shadow-xl hover:shadow-[#ff3366]/10">
                <div class="w-12 h-12 bg-[#ff3366]/10 text-[#ff3366] rounded-xl flex items-center justify-center mb-6">
                    <i data-lucide="download-cloud" class="w-6 h-6"></i>
                </div>
                <h3 class="text-xl font-bold mb-2">Downloader</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400">Audio previewing and batch download center.</p>
            </a>

            <!-- Tempo Tapper -->
            <a href="../tools/tempo-tapper.html" class="group p-8 rounded-2xl border border-gray-200 dark:border-[#2a2a2e] bg-white dark:bg-[#1c1c1f] hover:border-[#ff3366] transition-all hover:shadow-xl hover:shadow-[#ff3366]/10">
                <div class="w-12 h-12 bg-[#ff3366]/10 text-[#ff3366] rounded-xl flex items-center justify-center mb-6">
                    <i data-lucide="timer" class="w-6 h-6"></i>
                </div>
                <h3 class="text-xl font-bold mb-2">Tempo Tapper</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400">Calculate BPM and track timing precisely.</p>
            </a>

            <!-- Estimator -->
            <a href="../tools/size-estimator.html" class="group p-8 rounded-2xl border border-gray-200 dark:border-[#2a2a2e] bg-white dark:bg-[#1c1c1f] hover:border-[#ff3366] transition-all hover:shadow-xl hover:shadow-[#ff3366]/10">
                <div class="w-12 h-12 bg-[#ff3366]/10 text-[#ff3366] rounded-xl flex items-center justify-center mb-6">
                    <i data-lucide="calculator" class="w-6 h-6"></i>
                </div>
                <h3 class="text-xl font-bold mb-2">Size Estimator</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400">Estimate audio size.</p>
            </a>

        </div>
    </main>

    <script>
        // Theme toggle logic
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        }

        // Init icons
        lucide.createIcons();
    </script>
</body>
</html>
