<div class="p-5 text-center">
    <h2 class="font-bold text-xl">Tone Generator</h2>
    <input type="range" id="freqSlider" min="20" max="20000" value="440" class="w-full my-4" oninput="updateFreq()" />
    <p>Frequency: <span id="freqDisplay">440</span> Hz</p>
    <button onclick="toggleTone()" id="toneBtn" class="bg-[#ff3366] text-white px-4 py-2 mt-2">Play Tone</button>
</div>

<script>
    let toneCtx = new (window.AudioContext || window.webkitAudioContext)();
    let oscillator;
    let isPlayingTone = false;

    function updateFreq() {
        let freq = document.getElementById('freqSlider').value;
        document.getElementById('freqDisplay').innerText = freq;
        if (oscillator) oscillator.frequency.value = freq;
    }

    function toggleTone() {
        isPlayingTone = !isPlayingTone;
        const btn = document.getElementById('toneBtn');
        if (isPlayingTone) {
            oscillator = toneCtx.createOscillator();
            oscillator.type = 'sine';
            oscillator.frequency.value = document.getElementById('freqSlider').value;
            oscillator.connect(toneCtx.destination);
            oscillator.start();
            btn.innerText = "Stop Tone";
        } else {
            oscillator.stop();
            btn.innerText = "Play Tone";
        }
    }
</script>
