<div class="main-container">
    <header class="app-header">
        <h1>SensationalX Bath Reminders</h1>
    </header>

    <main>
        <!-- Top Section: High-Precision Timer Blocks -->
        <section id="timer-section" class="timer-section">
            <div class="timer-block">WK</div>
            <div class="timer-block number-large">00</div>
            <div class="timer-block">DAY</div>
            <div class="timer-block number-large">00</div>
            <div class="timer-block">HR</div>
            <div class="timer-block number-large">00</div>
            <div class="timer-block">MIN</div>
            <div class="timer-block number-large">00</div>
            <div class="timer-block">SEC</div>
            <div class="timer-block number-large">00</div>
            <div class="timer-block">MS</div>
            <div class="timer-block number-large">000</div>
            <div class="timer-block">NS</div>
            <div class="timer-block number-large">000000</div>
        </section>

        <p class="status-text">No active timers</p>

        <!-- Middle & Bottom Section: Controls & Form -->
        <section id="controls-section" class="controls-section">
            <div class="tabs-row">
                <button class="tab-btn active">One-Time Timer</button>
                <button class="tab-btn">Weekly Schedule</button>
            </div>

            <h2>Set Relative Duration</h2>

            <form class="timer-form">
                <!-- Field Group: Labels and Inputs are paired -->
                <div id="form-fields" class="form-fields-grid">
                    <div class="field-group">
                        <label for="weeks">Weeks</label>
                        <input type="number" id="weeks" value="0">
                    </div>
                    <div class="field-group">
                        <label for="days">Days</label>
                        <input type="number" id="days" value="0">
                    </div>
                    <div class="field-group">
                        <label for="hours">Hours</label>
                        <input type="number" id="hours" value="0">
                    </div>
                    <div class="field-group">
                        <label for="mins">Mins</label>
                        <input type="number" id="mins" value="20">
                    </div>
                    <div class="field-group">
                        <label for="secs">Secs</label>
                        <input type="number" id="secs" value="0">
                    </div>
                    <div class="field-group">
                        <label for="ms">Ms</label>
                        <input type="number" id="ms" value="0">
                    </div>
                    <div class="field-group">
                        <label for="ns">Ns</label>
                        <input type="number" id="ns" value="0">
                    </div>
                </div>

                <button type="submit" class="start-btn">Start One-Time Timer</button>
            </form>
        </section>
    </main>
</div>
