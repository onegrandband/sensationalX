<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensationalX Audio Recorder</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = { darkMode: 'class' }
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-[#0b0b0c] text-gray-900 dark:text-white font-sans antialiased transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Navigation Header -->
    <header class="flex items-center justify-between border-b border-gray-200 dark:border-[#2a2a2e] bg-white dark:bg-[#1c1c1f] px-[8%] py-4 sticky top-0 z-40 transition-colors">
        <div class="text-xl font-extrabold tracking-widest uppercase flex items-center gap-2">
            <span class="text-[#ff3366]">SX</span> AUDIO
            <i data-lucide="sparkles" class="w-5 h-5 text-[#ff3366]"></i>
        </div>
        <nav class="flex items-center gap-6">
            <a href="../index.html" class="text-sm font-bold uppercase tracking-wider text-gray-500 hover:text-[#ff3366] transition-colors">Home</a>
            <a href="../tools" class="text-sm font-bold uppercase tracking-wider text-gray-500 hover:text-[#ff3366] transition-colors">Tools</a>
            <button onclick="toggleTheme()" class="text-gray-500 hover:text-black dark:text-gray-400 dark:hover:text-white transition-colors">
                <i id="themeIcon" data-lucide="moon" class="w-5 h-5"></i>
            </button>
        </nav>
    </header>

    <!-- Main Audio Studio Container -->
    <main class="flex-1 flex items-center justify-center p-5">
        <div class="w-full max-w-md bg-white dark:bg-[#1c1c1f] p-8 rounded-2xl border border-gray-200 dark:border-[#2a2a2e] shadow-xl text-center space-y-6">
            
            <div class="space-y-1">
                <h1 class="text-2xl font-bold tracking-tight">Audio Recording Studio</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400" id="statusText">Ready to record.</p>
            </div>

            <!-- Controls -->
            <div class="flex justify-center gap-4">
                <button id="recordBtn" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-full shadow-lg hover:shadow-red-500/50 transition-all duration-200 cursor-pointer">
                    🎙️ Record
                </button>
                <button id="stopBtn" disabled class="bg-gray-200 dark:bg-gray-800 text-gray-400 dark:text-gray-500 cursor-not-allowed font-bold py-3 px-6 rounded-full transition-all duration-200">
                    ⏹️ Stop
                </button>
            </div>

            <!-- Playback & Effects Section -->
            <div class="space-y-4 hidden" id="playbackZone">
                <hr class="border-gray-200 dark:border-gray-700">
                <audio id="audioPlayer" controls class="w-full rounded-lg"></audio>
                
                <div class="text-left space-y-2 bg-gray-50 dark:bg-[#0b0b0c] p-4 rounded-xl border border-gray-200 dark:border-gray-800">
                    <label class="block text-sm font-semibold text-purple-600 dark:text-purple-400">Effect: Pitch & Speed</label>
                    <div class="flex items-center gap-3 text-xs text-gray-500 dark:text-gray-400">
                        <span>Demon</span>
                        <input type="range" id="effectSlider" min="0.5" max="2" step="0.1" value="1" class="w-full accent-purple-500 cursor-pointer">
                        <span>Chipmunk</span>
                    </div>
                </div>

                <a id="downloadLink" class="inline-block w-full bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-400 hover:to-pink-400 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-all duration-200 text-center cursor-pointer">
                    💾 Download Track
                </a>
            </div>

        </div>
    </main>

    <!-- JavaScript logic -->
    <script>
        // --- Theme Toggle Logic ---
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        });

        // --- Audio Recorder Logic ---
        let mediaRecorder;
        let audioChunks = [];

        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusText = document.getElementById('statusText');
        const playbackZone = document.getElementById('playbackZone');
        const audioPlayer = document.getElementById('audioPlayer');
        const downloadLink = document.getElementById('downloadLink');
        const effectSlider = document.getElementById('effectSlider');

        // Request microphone permission
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    
                    audioPlayer.src = audioUrl;
                    downloadLink.href = audioUrl;
                    
                    let extension = mediaRecorder.mimeType.includes('mp4') ? 'm4a' : 'webm';
                    downloadLink.download = `SX_Audio_Track.${extension}`;

                    playbackZone.classList.remove('hidden');
                    audioChunks = []; // Clear buffer for next run
                };
            })
            .catch(err => {
                statusText.innerText = "Microphone access denied!";
                statusText.classList.add("text-red-500");
                recordBtn.disabled = true;
                recordBtn.classList.replace('bg-red-500', 'bg-gray-400');
            });

        // Handle Record Button
        recordBtn.addEventListener('click', () => {
            if (!mediaRecorder) return;
            mediaRecorder.start();
            
            statusText.innerText = "Recording... 🔴";
            statusText.classList.add("text-red-500");
            statusText.classList.remove("text-gray-500", "dark:text-gray-400");
            
            recordBtn.disabled = true;
            recordBtn.classList.replace('bg-red-500', 'bg-gray-400');
            
            stopBtn.disabled = false;
            stopBtn.classList.replace('bg-gray-200', 'bg-purple-600');
            stopBtn.classList.replace('dark:bg-gray-800', 'bg-purple-600');
            stopBtn.classList.replace('text-gray-400', 'text-white');
            stopBtn.classList.replace('dark:text-gray-500', 'text-white');
            stopBtn.classList.remove('cursor-not-allowed', 'cursor-pointer');
            stopBtn.classList.add('cursor-pointer');
            
            playbackZone.classList.add('hidden');
        });

        // Handle Stop Button
        stopBtn.addEventListener('click', () => {
            if (!mediaRecorder) return;
            mediaRecorder.stop();
            
            statusText.innerText = "Recording saved!";
            statusText.classList.remove("text-red-500");
            statusText.classList.add("text-purple-500");
            
            recordBtn.disabled = false;
            recordBtn.classList.replace('bg-gray-400', 'bg-red-500');
            
            stopBtn.disabled = true;
            stopBtn.classList.replace('bg-purple-600', 'bg-gray-200');
            stopBtn.classList.replace('text-white', 'text-gray-400');
            stopBtn.classList.add('cursor-not-allowed');
            stopBtn.classList.remove('cursor-pointer');
        });

        // Apply Speed/Pitch Effect
        effectSlider.addEventListener('input', (e) => {
            audioPlayer.playbackRate = e.target.value;
            audioPlayer.preservesPitch = false; 
        });
    </script>
</body>
</html>
