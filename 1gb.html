<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Grand Band - Discount Code</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .discount-container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            max-width: 500px;
            text-align: center;
        }
        h3 {
            color: #2c3e50;
            margin-bottom: 15px;
        }
        p {
            line-height: 1.6;
            color: #555;
        }
        .partner-text {
            font-size: 0.9em;
            color: #888;
            margin-top: 20px;
            font-style: italic;
        }
        .claim-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background-color: #e74c3c;
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .claim-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <div class="discount-container">
        <h3>Unlock the One Grand Band Discount Code!</h3>
        <p>Unlock the exclusive discount code for our record label! Claim your free trial now. No credit card required.</p>
        
        <a href="#" class="claim-btn">Claim Free Trial</a>
        
        <p class="partner-text">(In partnership with One Grand Band!)</p>
    </div>

</body>
</html>
