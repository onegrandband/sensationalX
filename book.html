<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Demo | SensationalX</title>
    
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-color: #f4f4f4;
            --text-color: #111111;
            --text-muted: #555555;
            --accent-color: #d90429;
            --button-text: #ffffff;
            --border-color: #dddddd;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #eeeeee;
            --text-muted: #aaaaaa;
            --accent-color: #ef233c;
            --button-text: #ffffff;
            --border-color: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            background-color: var(--surface-color);
            border-bottom: 2px solid var(--accent-color);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo { font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }

        nav { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
        nav a { color: var(--text-color); text-decoration: none; font-weight: bold; font-size: 0.95rem; text-transform: uppercase; transition: color 0.2s; }
        nav a:hover { color: var(--accent-color); }

        .theme-toggle {
            background-color: transparent;
            color: var(--text-color);
            border: 2px solid var(--text-color);
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: var(--button-text);
        }

        .nav-btn {
            background-color: transparent;
            color: var(--text-color);
            border: none;
            padding: 0;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-btn:hover {
            color: var(--accent-color);
        }

        main { max-width: 600px; margin: 3rem auto; padding: 2rem; }

        h1 { font-size: 2.5rem; color: var(--accent-color); margin-bottom: 1rem; }
        p { font-size: 1.1rem; margin-bottom: 2rem; color: var(--text-muted); }

        /* Form Styles */
        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            background-color: var(--surface-color);
            padding: 2.5rem;
            border-radius: 4px;
            border-left: 4px solid var(--accent-color);
        }

        input, textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
            border-radius: 4px;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button[type="submit"] {
            background-color: var(--accent-color);
            color: var(--button-text);
            border: none;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            text-transform: uppercase;
            border-radius: 4px;
        }

        button[type="submit"]:hover { 
            opacity: 0.8; 
        }

        .error-message {
            color: #d90429;
            font-size: 0.9rem;
            margin-top: -1.2rem;
        }

        .success-message {
            color: #22c55e;
            font-size: 1rem;
            text-align: center;
            padding: 1rem;
            background-color: var(--surface-color);
            border-radius: 4px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SensationalX</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#catalog">Catalog</a>
            <a href="index.html#artists">Artists</a>
            <a href="book.html" style="color: var(--accent-color);">Book a Demo</a>
            <button class="nav-btn" onclick="openAuthModal()" id="navAccountBtn">Account</button>
            <button class="theme-toggle" id="themeBtn" aria-label="Toggle theme">Dark Mode</button>
        </nav>
    </header>

    <main>
        <h1>Book a Demo</h1>
        <p>Think you have what it takes? Send us your unreleased tracks. We listen to everything.</p>
        
        <form id="demoForm" novalidate>
            <input type="text" id="artistName" placeholder="Artist / Band Name" required>
            <input type="email" id="artistEmail" placeholder="Contact Email" required>
            <input type="url" id="demoLink" placeholder="Streaming Link (SoundCloud, Spotify, Private link)" required>
            
            <div id="captcha-container">
                <label for="captcha-input" style="font-size: 0.9rem;">
                    Verify you're human, type this code:
                    <strong id="captcha-code" style="letter-spacing: 4px; user-select: none; margin-left: 0.5rem;"></strong>
                    <button type="button" id="captcha-refresh" aria-label="New code" style="background: none; border: none; color: var(--accent-color); cursor: pointer; font-size: 1rem;">↻</button>
                </label>
                <input type="text" id="captcha-input" placeholder="Enter captcha code" autocomplete="off" required>
            </div>
            
            <div id="form-messages" aria-live="polite"></div>
            <button type="submit">Submit Demo</button>
        </form>
    </main>

    <script>
        // ---------- Theme ----------
        const root = document.documentElement;
        const themeBtn = document.getElementById('themeBtn');

        function readSavedTheme() {
            try { return localStorage.getItem('theme'); } catch { return null; }
        }

        function applyTheme(theme, save = false) {
            const isDark = theme === 'dark';
            if (isDark) root.setAttribute('data-theme', 'dark');
            else root.removeAttribute('data-theme');
            themeBtn.textContent = isDark ? 'Light Mode' : 'Dark Mode';
            if (save) {
                try { localStorage.setItem('theme', theme); } catch { /* storage unavailable */ }
            }
        }

        // Saved choice first, otherwise follow the OS preference
        applyTheme(
            readSavedTheme() ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        );

        themeBtn.addEventListener('click', () => {
            applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true);
        });

        // ---------- Authentication Modal ----------
        function openAuthModal() {
            alert('Account feature coming soon!');
            // TODO: Implement authentication modal
        }

        // ---------- Captcha (client-side only) ----------
        const captchaCodeEl = document.getElementById('captcha-code');
        const captchaInputEl = document.getElementById('captcha-input');
        let captchaCode = '';

        function generateCaptcha() {
            // Skip look-alike characters (0/O, 1/I/L)
            const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
            const values = crypto.getRandomValues(new Uint32Array(5));
            captchaCode = Array.from(values, v => chars[v % chars.length]).join('');
            captchaCodeEl.textContent = captchaCode;
            captchaInputEl.value = '';
        }

        document.getElementById('captcha-refresh').addEventListener('click', generateCaptcha);
        generateCaptcha();

        // ---------- Form handling ----------
        const form = document.getElementById('demoForm');
        const messagesDiv = document.getElementById('form-messages');
        let clearTimer = null;

        function showMessage(type, text) {
            clearTimeout(clearTimer);
            messagesDiv.replaceChildren();
            const div = document.createElement('div');
            div.className = type === 'success' ? 'success-message' : 'error-message';
            div.textContent = text; // textContent avoids HTML injection
            messagesDiv.appendChild(div);
        }

        function isValidEmail(value) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        }

        function isValidHttpUrl(value) {
            try {
                const url = new URL(value);
                return url.protocol === 'http:' || url.protocol === 'https:';
            } catch {
                return false;
            }
        }

        function handleFormSubmit(event) {
            event.preventDefault();

            const nameEl = document.getElementById('artistName');
            const emailEl = document.getElementById('artistEmail');
            const linkEl = document.getElementById('demoLink');

            const artistName = nameEl.value.trim();
            const artistEmail = emailEl.value.trim();
            const demoLink = linkEl.value.trim();
            const captchaValue = captchaInputEl.value.trim().toUpperCase();

            // Each check: [failed?, message, field to focus]
            const checks = [
                [!artistName, 'Artist name is required.', nameEl],
                [!artistEmail, 'Email is required.', emailEl],
                [artistEmail && !isValidEmail(artistEmail), 'Please enter a valid email address.', emailEl],
                [!demoLink, 'Streaming link is required.', linkEl],
                [demoLink && !isValidHttpUrl(demoLink), 'Please enter a valid link starting with http:// or https://.', linkEl],
                [!captchaValue, 'Please complete the captcha.', captchaInputEl],
                [captchaValue && captchaValue !== captchaCode, 'Captcha code is incorrect. Try the new code.', captchaInputEl]
            ];

            const failed = checks.find(([bad]) => bad);
            if (failed) {
                showMessage('error', failed[1]);
                failed[2].focus();
                if (failed[2] === captchaInputEl && captchaValue) generateCaptcha();
                return;
            }

            // TODO: Validate captcha on the backend
            // TODO: Send form data to backend API

            showMessage('success', "✓ Demo submitted successfully! We'll review your track and be in touch soon.");
            form.reset();
            generateCaptcha();

            // Clear success message after 5 seconds
            clearTimer = setTimeout(() => messagesDiv.replaceChildren(), 5000);
        }

        form.addEventListener('submit', handleFormSubmit);
    </script>
</body>
</html>
