<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Demo | SensationalX</title>
    
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-color: #f4f4f4;
            --text-color: #111111;
            --text-muted: #555555;
            --accent-color: #d90429;
            --button-text: #ffffff;
            --border-color: #dddddd;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #eeeeee;
            --text-muted: #aaaaaa;
            --accent-color: #ef233c;
            --button-text: #ffffff;
            --border-color: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            background-color: var(--surface-color);
            border-bottom: 2px solid var(--accent-color);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo { font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }

        nav { display: flex; gap: 1.5rem; align-items: center; }
        nav a { color: var(--text-color); text-decoration: none; font-weight: bold; font-size: 0.95rem; text-transform: uppercase; }
        nav a:hover { color: var(--accent-color); }

        .theme-toggle {
            background-color: transparent;
            color: var(--text-color);
            border: 2px solid var(--text-color);
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        main { max-width: 600px; margin: 3rem auto; padding: 2rem; }

        h1 { font-size: 2.5rem; color: var(--accent-color); margin-bottom: 1rem; }
        p { font-size: 1.1rem; margin-bottom: 2rem; color: var(--text-muted); }

        /* Form Styles */
        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            background-color: var(--surface-color);
            padding: 2.5rem;
            border-radius: 4px;
            border-left: 4px solid var(--accent-color);
        }

        input, textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
        }

        button {
            background-color: var(--accent-color);
            color: var(--button-text);
            border: none;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            text-transform: uppercase;
        }

        button:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <nav class="flex flex-wrap items-center gap-6 text-sm font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300">
            <a href="https://sensationalx.com/tools" class="text-[#ff3366] transition-colors">Studio Tools</a>
            <a href="index.html" class="hover:text-[#ff3366] transition-colors">Home</a>
            <a href="#catalog" class="hover:text-[#ff3366] transition-colors">Catalog</a>
            <a href="#artists" class="hover:text-[#ff3366] transition-colors">Artists</a>
            <a href="https://sensationalx.com/book.html" class="hover:text-[#ff3366] transition-colors">Book a Demo</a>
            <button onclick="openAuthModal()" id="navAccountBtn" class="hover:text-[#ff3366] transition-colors flex items-center gap-1">
                <i data-lucide="user" class="w-4 h-4"></i> Account
            </button>
          
        <button class="theme-toggle" id="themeBtn" aria-label="Toggle theme">Dark Mode</button>
    </header>

    <main>
        <h1>Book a Demo</h1>
        <p>Think you have what it takes? Send us your unreleased tracks. We listen to everything.</p>
        
        <form id="demoForm" onsubmit="handleFormSubmit(event)">
            <input type="text" id="artistName" placeholder="Artist / Band Name" required>
            <input type="email" id="artistEmail" placeholder="Contact Email" required>
            <input type="url" id="demoLink" placeholder="Streaming Link (SoundCloud, Spotify, Private link)" required>
            
            <div id="custom-captcha-container">
                <p style="font-size: 0.85rem; font-style: italic;">[ Your API Verification / Captcha Code Goes Here ]</p>
            </div>
            
            <button type="submit">Submit Demo</button>
        </form>
    </main>

    <script>
        // Dark Mode
        const btn = document.getElementById('themeBtn');
        btn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                btn.textContent = 'Dark Mode';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                btn.textContent = 'Light Mode';
            }
        });

        // Form Handling
        function handleFormSubmit(event) {
            event.preventDefault(); 
            const userKeyOrToken = "YOUR_HCAPTCHA_API_KEY_OR_TOKEN_VARIABLE"; 
            alert("Demo submitted! Ready for backend connection.");
            event.target.reset(); 
        }
    </script>
</body>
</html>
