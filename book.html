<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Demo | SensationalX</title>
    
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-color: #f4f4f4;
            --text-color: #111111;
            --text-muted: #555555;
            --accent-color: #d90429;
            --button-text: #ffffff;
            --border-color: #dddddd;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #eeeeee;
            --text-muted: #aaaaaa;
            --accent-color: #ef233c;
            --button-text: #ffffff;
            --border-color: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            background-color: var(--surface-color);
            border-bottom: 2px solid var(--accent-color);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo { font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }

        nav { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
        nav a { color: var(--text-color); text-decoration: none; font-weight: bold; font-size: 0.95rem; text-transform: uppercase; transition: color 0.2s; }
        nav a:hover { color: var(--accent-color); }

        .theme-toggle {
            background-color: transparent;
            color: var(--text-color);
            border: 2px solid var(--text-color);
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: var(--button-text);
        }

        .nav-btn {
            background-color: transparent;
            color: var(--text-color);
            border: none;
            padding: 0;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-btn:hover {
            color: var(--accent-color);
        }

        main { max-width: 600px; margin: 3rem auto; padding: 2rem; }

        h1 { font-size: 2.5rem; color: var(--accent-color); margin-bottom: 1rem; }
        p { font-size: 1.1rem; margin-bottom: 2rem; color: var(--text-muted); }

        /* Form Styles */
        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            background-color: var(--surface-color);
            padding: 2.5rem;
            border-radius: 4px;
            border-left: 4px solid var(--accent-color);
        }

        input, textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
            border-radius: 4px;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button[type="submit"] {
            background-color: var(--accent-color);
            color: var(--button-text);
            border: none;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            text-transform: uppercase;
            border-radius: 4px;
        }

        button[type="submit"]:hover { 
            opacity: 0.8; 
        }

        .error-message {
            color: #d90429;
            font-size: 0.9rem;
            margin-top: -1.2rem;
        }

        .success-message {
            color: #22c55e;
            font-size: 1rem;
            text-align: center;
            padding: 1rem;
            background-color: var(--surface-color);
            border-radius: 4px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SensationalX</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#catalog">Catalog</a>
            <a href="index.html#artists">Artists</a>
            <a href="book.html" style="color: var(--accent-color);">Book a Demo</a>
            <button class="nav-btn" onclick="openAuthModal()" id="navAccountBtn">Account</button>
            <button class="theme-toggle" id="themeBtn" aria-label="Toggle theme">Dark Mode</button>
        </nav>
    </header>

    <main>
        <h1>Book a Demo</h1>
        <p>Think you have what it takes? Send us your unreleased tracks. We listen to everything.</p>
        
        <form id="demoForm" onsubmit="handleFormSubmit(event)">
            <input type="text" id="artistName" placeholder="Artist / Band Name" required>
            <input type="email" id="artistEmail" placeholder="Contact Email" required>
            <input type="url" id="demoLink" placeholder="Streaming Link (SoundCloud, Spotify, Private link)" required>
            
            <div id="captcha-container">
                <label for="captcha-input" style="font-size: 0.9rem;">Verify you're human:</label>
                <input type="text" id="captcha-input" placeholder="Enter captcha code" required>
            </div>
            
            <div id="form-messages"></div>
            <button type="submit">Submit Demo</button>
        </form>
    </main>

    <script>
        // Dark Mode
        const themeBtn = document.getElementById('themeBtn');
        themeBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                themeBtn.textContent = 'Dark Mode';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeBtn.textContent = 'Light Mode';
            }
        });

        // Authentication Modal
        function openAuthModal() {
            alert("Account feature coming soon!");
            // TODO: Implement authentication modal
        }

        // Form Handling
        function handleFormSubmit(event) {
            event.preventDefault();
            
            const artistName = document.getElementById('artistName').value.trim();
            const artistEmail = document.getElementById('artistEmail').value.trim();
            const demoLink = document.getElementById('demoLink').value.trim();
            const captchaInput = document.getElementById('captcha-input').value.trim();
            const messagesDiv = document.getElementById('form-messages');
            
            // Clear previous messages
            messagesDiv.innerHTML = '';
            
            // Validate inputs
            if (!artistName) {
                messagesDiv.innerHTML = '<div class="error-message">Artist name is required.</div>';
                return;
            }
            
            if (!artistEmail) {
                messagesDiv.innerHTML = '<div class="error-message">Email is required.</div>';
                return;
            }
            
            if (!demoLink) {
                messagesDiv.innerHTML = '<div class="error-message">Streaming link is required.</div>';
                return;
            }
            
            if (!captchaInput) {
                messagesDiv.innerHTML = '<div class="error-message">Please complete the captcha.</div>';
                return;
            }
            
            // TODO: Validate captcha against backend
            // TODO: Send form data to backend API
            
            messagesDiv.innerHTML = '<div class="success-message">✓ Demo submitted successfully! We\'ll review your track and be in touch soon.</div>';
            event.target.reset();
            
            // Clear success message after 5 seconds
            setTimeout(() => {
                messagesDiv.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
